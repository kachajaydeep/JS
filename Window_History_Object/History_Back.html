<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>History Back</title>
</head>
<body>
     <p>The Window.History Object Containes The browsers History.</p>
     <p id="demo"></p>

     <input type="button" onclick="goBack()" value="Back">

     <script>
          function goBack(){
               window.history.back();
          }
     </script>
