<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Number()</title>
</head>
<body>
     <p id="demo"></p>
     <p>Number Method can be Converts Javascript Variables to Numbers.</p>

     <script>
          document.getElementById("demo").innerHTML = 
          Number(true)  + "<br>" + 
          Number(false) + "<br>" +
          Number("10") + "<br>" +
          Number(" 10") + "<br>" +
          Number("10 ") + "<br>" +
          Number(" 10 ") + "<br>" + 
          Number("10.33") + "<br>" +
          Number("10,33") + "<br>" +
          Number("10 33") + "<br>" +
          Number("John");
     </script>
</body>
</html>
