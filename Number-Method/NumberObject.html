<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Number-Method belong to Object</title>
</head>

<body>
     <p id="demo"></p>
     <p>Number Method can belong only to the number object it is access only like "Number.isInteger(10)"</p>
     <script>
          document.getElementById("demo").innerHTML =
               Number.isInteger(10) + "<br>" + Number.isInteger(10.5);

     </script>
</body>

</html>
