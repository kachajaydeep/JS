<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ValueOf()</title>
</head>
<body>
     <p>The ValueOf() method returns a number as a Number:</p>

     <p id="demo"></p>

     <script>
          let x = 123;

          document.getElementById("demo").innerHTML =
          x.valueOf() + (96).valueOf();
     </script>
</body>
</html>
