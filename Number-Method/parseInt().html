<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ParseInt()</title>
</head>

<body>
     <p>The ParseInt method Converts the String to Number.</p>
     <p>ParseInt રીત નો ઉપયોગ સ્ટ્રીંગ માંથી નંબરમાં બદલવા માટે થાય છે.</p>
     <p id="demo"></p>
     <script>
          document.getElementById("demo").innerHTML =
               parseInt("10") + "<br>"  +
               parseInt("3.14") + "<br>"  +
               parseInt("2.00") + "<br>"  +
               parseInt(" hello") + "<br>"  +
               parseInt("lion ") + "<br>";
     </script>
</body>

</html>
