<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>toString()</title>
</head>

<body>
     <p>The toString() Method converts the Numbers to String.</p>
     <p id="demo"></p>

     <script>
          let x = 123;
          document.getElementById("demo").innerHTML = x.toString() + "<br>" + (123).toString() + "<br>"  + (100 + 10 + 13).toString();
     </script>
</body>

</html>
