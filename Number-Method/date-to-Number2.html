<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Data-To-Number</title>
</head>
<body>
     <p>The Number() method can be used to Converts Date to Number.</p>
     <p id="demo"></p>
     <script>
          let date = new Date(`02-04-2025`);
          document.getElementById("demo").innerHTML = Number(date);
     </script>
</body>
</html>
