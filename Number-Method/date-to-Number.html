<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Date To Number</title>
</head>

<body>
     <p>The Number() method can Convert a Date to Number.</p>
     <p id="demo"></p>

     <script>
          let x = new Date("1970-01-03");
          document.getElementById("demo").innerHTML = Number(x);
     </script>
</body>

</html>
