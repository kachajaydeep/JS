<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Send Parameter to Class Method</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          class Car {
               constructor(name, year) {
                    this.name = name;
                    this.year = year;
               }

               age(x) {
                    return x - this.year;
               }
          }
          const date = new Date();
          let year = date.getFullYear();

          const myCar = new Car("Ford", 2015);
          document.getElementById("demo").innerHTML =
               "My Car is " + myCar.age(year) + " Year's Old. "
     </script>
</body>

</html>
