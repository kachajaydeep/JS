<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Class Example 1</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          class Car {
               constructor(name, year) {
                    this.name = name;
                    this.year = year;
               }
          }

          const mycar1 = new Car("ford", 2000);
          const mycar2 = new Car("Audi", 2019);
          document.getElementById("demo").innerHTML = mycar1.name + " " + mycar2.year;
     </script>
</body>

</html>
