<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Array Cannot Reassign</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          try {
               const cars = ["Saab", "Volvo", "BMW"];
               cars = ["Odi", "Rols Royal", "Xuv"];
          }
          catch (err) {
               document.getElementById("demo").innerHTML = err;
          }
     </script>
</body>

</html>
