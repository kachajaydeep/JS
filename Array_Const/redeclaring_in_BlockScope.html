<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Redeclaring In BlockScope</title>
</head>
<body>
     <p id="demo"></p>
     <p id="demo1"></p>

     <script>
          const students = ["Ramu","Shamu","Jamna","Chagan"];

          {
               const students = ["Rohan","Mohan","Jalpa","janny"];
               document.getElementById("demo").innerHTML = students;
          }
          document.getElementById("demo1").innerHTML = students;
     </script>
</body>
</html>
