<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>one_line</title>
</head>

<body>
     <h2>Javascript statements are one line allowed.</h2>

     <div id="demo"></div>

     <script>
          let a, b, c;
          a = 2; b = 3; c = a + b;
          document.getElementById("demo").innerHTML = c;
     </script>
</body>

</html>
