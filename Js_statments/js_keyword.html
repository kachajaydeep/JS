<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>js_keyword</title>
</head>

<body>
     <h1>Js keyword are used to identify the action to be perform.</h1>
     <div id="demo"></div>
     <script>
          let x, y;
          x = 20;
          y = 10;
          document.getElementById("demo").innerHTML = x + y;
     </script>
</body>

</html>
