<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Calculation Using Window Object</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let p1 = 7;
          let p2 = 5;

          window.addEventListener("click", function () {
               myFunction(p1, p2);
          });

          function myFunction(a, b) {
               let result = a * b;
               document.getElementById("demo").innerHTML = result;
          }

     </script>
</body>

</html>
