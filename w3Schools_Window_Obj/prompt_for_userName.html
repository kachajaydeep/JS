<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Prompt to take UserName</title>
</head>

<body>
     <input type="button" onclick="myFunction()" value="click Here!">
     <p id="demo"></p>

     <script>

          function myFunction() {
               let person = prompt("Please Enter Your Name like: ", "Harry Potter");

               if (person != null) {
                    document.getElementById("demo").innerHTML =
                         "Hello " + person + "! How are you today? ";
               }
          }
     </script>
</body>

</html>
