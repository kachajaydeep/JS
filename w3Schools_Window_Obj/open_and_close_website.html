<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Open and Close The Window</title>
</head>

<body>
     <button onclick="openWin()">Open website</button>
     <button onclick="closeWin()">Close Website</button>

     <script>
          function openWin() {
               myWindow = window.open("https://toforzero-hr.sddemo.in/web/index.php/dashboard/index", "_blank", "width = 500px,height = 500px");
          }

          function closeWin() {
               myWindow = window.close("https://toforzero-hr.sddemo.in/web/index.php/dashboard/index");
          }
     </script>
</body>

</html>
