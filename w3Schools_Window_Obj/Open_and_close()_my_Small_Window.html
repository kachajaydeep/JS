<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Close Method</title>
</head>

<body>
     <p id="demo"></p>
     <button onclick="openWin()">OpenWindow</button>
     <button onclick="closeWin()">CloseWindow</button>
     
     <script>
          let myWindow;

          function openWin() {
               myWindow = window.open("", "", "width = 200, height = 100");
          }

          function closeWin() {
               myWindow.close();
          }
     </script>
</body>

</html>
