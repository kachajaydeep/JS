<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>background color EventListner</title>
</head>

<body>
     <p>Click to check Background Color of Html document.</p>
     <p id="demo"></p>

     <script>
          document.addEventListener("click", function () {
               document.body.style.background = "pink";
          })
     </script>
</body>

</html>
