<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>While_loop</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let x = 1;

          let text = "";
          while( x < 10){
               text += "<br> The Number is " + x;
               x++;
          }
          document.getElementById("demo").innerHTML = text;
     </script>
</body>
</html>
