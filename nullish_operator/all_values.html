<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>All_Values</title>
</head>
<body>
     <p id="demo1"></p>
     <p id="demo2"></p>
     <p id="demo3"></p>
     <script>
          const nullValue = null;
          const emptyValue = "";
          const someNumber = 45;

          const val1 = nullValue ?? "default String";
          const val2 = emptyValue ?? "DeFault String";
          const val3 = someNumber ?? 0;
          document.getElementById("demo1").innerHTML = val1;
          document.getElementById("demo2").innerHTML =val2;
          document.getElementById("demo3").innerHTML = val3;
     </script>
</body>
</html>
