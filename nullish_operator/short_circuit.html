<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Short_Circuit</title>
</head>
<body>
     <p id="demo"></p>
     <p id="demo1"></p>
     <p id="demo2"></p>
     <script>
          function a(){
               console.log("a was Evaluted");
               return undefined;
          }
          function b(){
               console.log("b was Evaluted");
               return false;
          }

          function c(){
               console.log("c was Evaluted");
               return "foo";
          }
          console.log(a() ?? c());
          console.log(b() ?? c());
          // document.getElementById("demo").innerHTML = a() ?? c();
          // document.getElementById("demo1").innerHTML = b() ?? c();

     </script>
</body>
</html>
