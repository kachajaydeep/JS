<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>instanceof</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let name = {
               first: "rohan",
               second: "mohan",
               third: "raman",
               fourth: "chaman"
          }

          document.getElementById("demo").innerHTML = name instanceof Object;
     </script>
</body>

</html>
