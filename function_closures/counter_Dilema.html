<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Counter Dilema</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let Counter = 0;

          function add() {
               Counter += 1;
          }
          add();
          add();
          add();

          document.getElementById("demo").innerHTML = "Counter : " + Counter;
     </script>
</body>

</html>
