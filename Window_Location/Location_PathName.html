<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Location PathName</title>
</head>
<body>
     <p>window.location.pathname property returns the path name of the Current Page.</p>
     <p id="demo"></p>

     <script>
          document.getElementById("demo").innerText = 
          "Your Current File Path Name is : " + window.location.pathname;
     </script>
</body>
</html>
