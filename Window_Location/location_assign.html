<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
</head>

<body>
     <p id="demo"></p>
     <h3>The window.location object.</h3>

     <input type="button" value="Load new document" onclick="newDoc()">
     <script>
          function newDoc() {
               document.getElementById("demo").innerText = location.assign("https://www.w3schools.com");
          }
     </script>
</body>

</html>
