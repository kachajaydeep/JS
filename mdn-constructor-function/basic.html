<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Constructor Function</title>
</head>
<body>
     <p>The Constructor Function Which can Create Function only Access <b>Globle Scope.</b></p>
     <p id="demo"></p>

     <script>
          const sum = new Function("a","b","return a+b");

          document.getElementById("demo").innerHTML = sum(2,6);
     </script>
</body>
</html>
