     <p id="demo2"></p>
     <p id="demo3"></p>

          }
          const Person = {
               Name: "hello123",
               age: 23,
               color: "Black",
          };
          document.getElementById("demo1").innerHTML = Person.Name
          let change = myPer(Person);
          document.getElementById("demo2").innerHTML = Person.Name;
     </script>
