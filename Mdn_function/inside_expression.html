<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>inside Expression</title>
</head>
<body>
     <p>Function can be used as a Function Expression using <b><mark>function</mark> keyword</b></p>
     <p id="demo1"></p>
     <p id="demo2"></p>

     <script>
          const myExpression = function (width,height){
               return width * height;
          }
          document.getElementById("demo1").innerHTML = myExpression(4,3);
     </script>
</body>
</html>
