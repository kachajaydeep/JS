<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Named_Function_Compatibility</title>
</head>
<body>
     <p id="demo1"></p>
     <p id="demo2"></p>
     <p id="demo3"></p>

     <script>
          const math = {
               factorial: function factorial(n){
                    console.log(n);
                    if (n <= 1){
                         return 1;
                    }
                    return n * factorial(n - 1);
               },
          };
          math.factorial(3);
     </script>
</body>
</html>
