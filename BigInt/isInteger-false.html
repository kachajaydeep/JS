<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>isInteger-false</title>
</head>

<body>
     <p>The isInteger method return true if the argument is an integer.</p>
     <p id="demo"></p>

     <script>
          document.getElementById("demo").innerHTML =
               Number.isInteger(10) + "<br>" + Number.isInteger(10.5);
     </script>
</body>

</html>
