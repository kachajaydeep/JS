<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Arithmatic is Not Allowed!</title>
</head>
<body>
     <p>A BigInt can not have decimals.</p>
     <p id="demo"></p>

     <script>
          let x = 5n;
          let y = Number(x) / 2; //Converted BigInt into Number using Number() Function.

          document.getElementById("demo").innerHTML = y;
     </script>
</body>
