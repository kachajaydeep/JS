<!DOCTYPE html>
<html lang="en">

<head>

     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Basic Of Integer</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let x = 999999999999999;
