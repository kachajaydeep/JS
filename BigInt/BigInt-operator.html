<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>BigInt in Used Operator</title>
</head>

<body>
     <p>Operator that can used Number can be used on BigInt.</p>
     <p id="demo"></p>
     <script>
          let x = 9090909090909090n;
          let y = 9090909090909090n;
          document.getElementById("demo").innerHTML = x * y;
     </script>
</body>

</html>
