<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>BigInt after Integer</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let x = 12345678910111213141516171819n;
          let y = BigInt(12345678910111213141516171819n);
          document.getElementById("demo").innerHTML = typeof x + "<br>" + typeof y;
     </script>
</body>

</html>
