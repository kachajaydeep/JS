<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Number.isInteger()</title>
</head>

<body>
     <p>Es6 has 2 new methods for integer</p>
     <p id="demo"></p>
     <script>
          let x = 10;
          let y = Number.isInteger(x);

          document.getElementById("demo").innerHTML = y;
     </script>
</body>

</html>
