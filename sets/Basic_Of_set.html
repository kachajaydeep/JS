<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Basic Of Set</title>
</head>

<body>
     <p>A Sets is a Collection of Unique Values.</p>
     <p>Each Value can only Occur once in a Set.</p>
     <p id="demo"></p>
     <script>

          const letters = new Set(["a", "b", "c"]);
          document.getElementById("demo").innerHTML = "The set has " + letters.size + " Values. ";
     </script>
</body>

</html>
