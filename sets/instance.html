<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Instance Of</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const letters = new Set(["a", "b", "c"]);

          document.getElementById("demo").innerHTML = letters instanceof Set;
     </script>
</body>

</html>
