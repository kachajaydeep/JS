<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Sets are Object</title>
</head>

<body>
     <p id="demo"></p>

     <script>

          const letters = new Set(["a", "b", "c"]);

          document.getElementById("demo").innerHTML = "The Type of the set : " + typeof letters;
     </script>
</body>

</html>
