<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Add Methods</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const cars = new Set();

          cars.add("BMW");
          cars.add("ODI");
          cars.add("TATA");

          document.getElementById("demo").innerHTML = " The set has " + cars.size + " Values. ";
     </script>
</body>
