<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Writing Read Mode Property</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          "use strict";
          const obj = {};
          obj.defineProperty(obj, "x", { value: 0, writable: false });
          obj.x = 4;     
     </script>
</body>

</html>
