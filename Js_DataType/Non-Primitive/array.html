<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Array</title>
</head>
<body>
     <p id="demo"></p>
     <p id="demo1"></p>
     <p id="demo2"></p>
     <script>
          const students = ["rohan", "mohan","ramu" ,"shamu","azadi amar raho!"];
          document.getElementById("demo").innerHTML = students[0] + students[2] + students[3];
          document.getElementById("demo1").innerHTML = students[1];
          document.getElementById("demo2").innerHTML = students[4];
     </script>
</body>
</html>
