<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Display Object Using Names</title>
</head>
<body>
     <p id="demo"></p>
     <script>
          const Person = {
               name: "John",
               age:30,
               city: "New York"
          };

          document.getElementById("demo").innerHTML = Person.name + " is a " + Person.age + " Years Old " + Person.city;
     </script>
</body>
</html>
