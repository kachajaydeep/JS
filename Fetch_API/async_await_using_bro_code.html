<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Async Await Using Bro Code</title>
</head>

<body>
     <script>
          
          fetchData();

          async function fetchData() {
               try{
                    const response = await fetch('https://pokeapi.co/api/v2/pokemon/typhlosion');

                    if (!response.ok) {
                         throw new Error('Could Not Found Response!');
                    }
                    const data = await response.json();
                    console.log(data);
               }
               catch(error) {
                    console.log(error);
               }
          }
     </script>
</body>

</html>
