<body>
     <p>Primitive Values are 7 Types.</p>
     <p>Primitive Values are Immutable <b>(They cann't be changed and hardcoded)</b></p>
     
     <h1>For Example x=3.14, we can change the value of x but we cann't change the value of 3.14 example is showen below.</h1>
     <p id="demo"></p>
     <script>
          let x = 3.14;
          x=42; //we can change value of x
          document.getElementById("demo").innerHTML = "value of x :" + " " +x ;
          // 3.14 = 30; we cann't change value of the 3.14;
     </script>
