<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Mutable_Object</title>
</head>
<body>
     <p>Objects are mutable.</p>
     <p id="demo"></p>

     <script>
          const person = {
               firstName:"Joe",
               lastName:"Doe",
               age:30
          }
     const x = person;
     x.age = 50;
     document.getElementById("demo").innerHTML = person.firstName + " " + person.lastName + " is a " + person.age + " Years old. ";
     </script>
</body>
</html>
