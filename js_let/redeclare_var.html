<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>redeclare-var</title>
</head>
<body>
     <h1>It's possible in var keyword to redeclaring.</h1>
     <div id="demo"></div>

     <script>
          var x = "Joe Doe" //only redeclare a variable using var keyword.
          var x = 10;
          document.getElementById("demo").innerHTML= x;
     </script>
</body>
</html>
