<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>let-hosting</title>
</head>
<body>
     <p>In let keyword hosting is not possible</p>
     <p>not declare before It's Initialization.</p>
     <p id="demo"></p>

     <script>
          try{
               z = 24;
               let z;
          }
          catch(err) {
               document.getElementById("demo").innerHTML = err;
          }
     </script>
</body>
</html>
