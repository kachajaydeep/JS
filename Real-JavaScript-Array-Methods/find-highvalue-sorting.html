<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>find Highest Value Sorting</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const num = [20, 30, 40, 10, 30, 60];

          num.sort(function (a, b) {
               return b - a;
          })

          document.getElementById("demo").innerHTML = num[0];
     </script>
</body>

</html>
