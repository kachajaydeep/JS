<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Concate Nested Array</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const arr1 = [1, 2, [3, 4]];
          const arr2 = [[5, 6], 7, 8];

          const Nested = arr1.concat(arr2);

          document.getElementById("demo").innerHTML = Nested;
     </script>
</body>

</html>
