<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Item With Index</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "";
          const person = ["Rohan", "Mohan", "Harry", "Rushi"];
          person.forEach(myFunction);


          function myFunction(item, index) {
               text += index + 1 +  " : " + item + "<br>";
          } 

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
