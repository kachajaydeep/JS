<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Entries</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const myArr = ["Ramu", "shamu", "hetu", "Denis"];

          let text = "";
          for (let x of Object.entries(myArr)) {
               text += x + "<br>";
          }
          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
