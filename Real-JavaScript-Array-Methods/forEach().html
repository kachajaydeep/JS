<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>forEach()</title>
</head>

<body>
     <p><b>forEach()</b> methods calls a function for Each elements in array.</p>
     <p>The forEach() Elements not executed for empty elements.</p>

     <script>
          const fruits = ["apple", "orange", "cherry"];
          fruits.forEach(function (fetch) {
               document.writeln(fetch);
          })
     </script>
</body>

</html>
