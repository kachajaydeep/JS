<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Concate String and Numbers</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const arr1 = ["hello", "World", "hai kya"];
          const Numbers = [1, 22, 23, 24, 55, 66];

          const NumString = arr1.concat(Numbers)
          document.getElementById("demo").innerHTML = NumString;
     </script>
</body>

</html>
