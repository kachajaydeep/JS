<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Descending sort()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = ["Banana", "Chiku", "Choconets", "Mango", "Apple"];

          fruits.sort();

          fruits.reverse();

          document.getElementById("demo").innerHTML = fruits;
     </script>
</body>

</html>
