<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Concate Three Array</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const arr1 = ["Android", "Linux", "Mac"];
          const arr2 = ["Google", "Linus", "Apple"];
          const arr3 = ["Satya nandela", "steve Jobs", "Sunder Pichai"];

          const merge = arr1.concat(arr2, arr3);

          document.getElementById("demo").innerHTML = merge;
     </script>
</body>

</html>
