<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Every()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const age = [32, 34, 32, 20];

          function checkAge(age) {
               return age > 18;
          }

          const store = age.every(checkAge);

          document.getElementById("demo").innerHTML = store;
     </script>
</body>

</html>
