<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>values</title>
</head>

<body>
     <p>The Values() methods returns an Iterator object with the values of an array.</p>
     <p>It Dose Not Change the Original Array.</p>
     <p id="demo"></p>

     <script>
          const array = ["Apple", "Banana", "Graps", "Watermallon", "Pineapple"];

          const list = array.values();

          let text = "";
          for (let x of list) {
               text += x + "<br>";
          }

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
