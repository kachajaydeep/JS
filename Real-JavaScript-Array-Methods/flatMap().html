<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>flatMap()</title>
</head>

<body>
     <p>The flatMap() function is Maps Every Elements in array and Creates a New Array.</p>
     <p>The flatMap() is Creates a New array and Calling a function for every Element.</p>
     <p id="demo"></p>

     <script>
          const myArr = [1, 2, 3, 4, 5];
          const newArr = myArr.flatMap(x => [x * 10]);

          document.getElementById("demo").innerHTML = newArr;
     </script>
</body>

</html>
