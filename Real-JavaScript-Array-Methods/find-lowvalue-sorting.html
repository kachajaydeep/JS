<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>find Lowest Value Sorting</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const points = [30, 20, 10, 35, 60, 70];

          points.sort(function (a, b) {
               return a - b;
          })

          document.getElementById("demo").innerHTML = points[0];
     </script>
</body>

</html>
