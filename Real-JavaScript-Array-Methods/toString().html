<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>toString</title>
</head>

<body>
     <script>
          const myArr = ["chikku", "Joe", "Doe", "John", "Cena"];
          const String = myArr.toString();

          document.writeln(typeof String + "<br>");
          document.writeln(typeof myArr);
     </script>
</body>

</html>
