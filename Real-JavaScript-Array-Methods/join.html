<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Join</title>
</head>

<body>

     <p>The join Method returns array as an String.</p>
     <p>The join Method does not Change The Original Array.</p>
     <p id="demo"></p>

     <script>
          const fruits = ["Apple", "Banana", "Mango", "Graps", "Kiwi"];

          const joining = fruits.join("<b> and </b>");
          document.getElementById("demo").innerHTML = joining;
     </script>
</body>

</html>
