<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>IndexOf With Position</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = ["Banana", "graps", "Apple", "Mango", "Orange", "Apple"];

          let index = fruits.indexOf("Apple", 3);

          document.getElementById("demo").innerHTML = index;
     </script>
</body>

</html>
