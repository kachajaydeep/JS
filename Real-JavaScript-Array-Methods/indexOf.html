<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>IndexOf()</title>
</head>

<body>
     <p>indexOf() returns the Position of a Specified value in an array:</p>

     <p id="demo"></p>

     <script>
          const fruits = ["Apple", "Banana", "Graps", "Orange", "Mango"];

          document.getElementById("demo").innerHTML = fruits.indexOf("Banana");
     </script>
</body>

</html>
