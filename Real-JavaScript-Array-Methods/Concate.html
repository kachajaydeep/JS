<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Concate</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Arr1 = ["Rohan", "Mohan", "shamu"];
          const Arr2 = ["chagan", "Magan", "Linus"];

          const children = Arr2.concat(Arr1);

          document.getElementById("demo").innerHTML = children;
     </script>
</body>

</html>
