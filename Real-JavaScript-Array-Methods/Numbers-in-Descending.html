<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Numbers in Descending Order</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Numbers = [20, 40, 30, 10, 15, 50];

          Numbers.sort();

          Numbers.reverse();

          document.getElementById("demo").innerHTML = Numbers;
     </script>
</body>

</html>
