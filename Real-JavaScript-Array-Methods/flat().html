<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>flat()</title>
</head>
<body>
     <p>Create a New array sub-array Concatinated.</p>
     <p id="demo"></p>

     <script>
          const myArr =[[1,2],[3,4],[5,6],7,8];
          const concatinated = myArr.flat();

          document.getElementById("demo").innerHTML = concatinated;
     </script>
</body>
</html>
