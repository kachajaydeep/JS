<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Sorting using Function</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const points = [20, 15, 25, 30, 22, 60];

          points.sort(function (a, b) { return a - b });

          document.getElementById("demo").innerHTML = points;
     </script>
</body>

</html>
