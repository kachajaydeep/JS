<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Sorting Numbers</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Num = [20, 10, 25, 50, 30, 40];

          const assending = Num.sort();

          document.getElementById("demo").innerHTML = assending;
     </script>
</body>

</html>
