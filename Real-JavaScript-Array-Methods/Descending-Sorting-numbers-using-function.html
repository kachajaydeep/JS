<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Sorting Numbers in Descending using Function</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const num = [10, 30, 20, 60, 50, 40];

          num.sort(function (a, b) {
               return b - a;
          });

          document.getElementById("demo").innerHTML = num;
     </script>
</body>

</html>
