<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>toLocalString()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let CSE = ["Nikhil", "Priyansi", "Rushi", "Shreya"];
          let String = CSE.toLocaleString();

          document.getElementById("demo").innerHTML = String;

          console.log(String);
          console.log(typeof String);
          console.log(CSE);
     </script>
</body>

</html>
