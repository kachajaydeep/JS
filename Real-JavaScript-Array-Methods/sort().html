<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>sort()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = ["Banana", "Chiku", "Mango", "Apple", "Coconets"];
          document.getElementById("demo").innerHTML = fruits.sort();
     </script>
</body>

</html>
