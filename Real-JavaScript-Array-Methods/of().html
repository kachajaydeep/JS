<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>of()</title>
</head>
<body>
     <p>Array of Methods Create a new Array from any Number of argument.</p>
     <p>Array of Methods can take any number of argument.</p>
     <p id="demo"></p>

     <script>
          let fruits = Array.of("Banana", "Orange","Mango", "Apple");

          document.getElementById("demo").innerHTML = fruits;
     </script>
</body>
</html>
