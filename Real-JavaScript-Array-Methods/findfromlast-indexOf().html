<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>find from last IndexOf()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = ["Apple", "Banana", "Graps", "Mango", "Oranges", "Apple"];

          document.getElementById("demo").innerHTML = fruits.indexOf("Apple", -1);
     </script>
</body>

</html>
