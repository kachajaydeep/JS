<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Splice Items</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Person = ["Ramu", "Shamu", "Michal", "Jordan"];

          Person.splice(2, 0, "Lemon", "Kiwi");

          document.getElementById("demo").innerHTML = Person;
     </script>
</body>

</html>
