<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Copy Another Position</title>
</head>

<body>
     <p>copyWithin() copies array elements to another Position in an array, overwriting existing values:</p>
     <p id="demo"></p>

     <script>
          const arr = ["apple", "graps", "Banana", "mango"];

          const copy = arr.copyWithin(2, 0);

          document.getElementById("demo").innerHTML = copy;
     </script>
</body>

</html>
