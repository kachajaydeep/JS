<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Fill Elements</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = ["Banana", "Oranges", "Apples", "Mango"];
          document.getElementById("demo").innerHTML = fruits.fill("Kiwi");
     </script>

</body>

</html>
