<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Includes()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Programming = ["C", "C++", "Java", "JavaScript", "Python"];

          const check = Programming.includes("JavaScript");

          document.getElementById("demo").innerHTML = check;
     </script>
</body>

</html>
