<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Unshift In Numbers.</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const age = [10, 20, 30, 40, 62, 91];
          age.unshift(7);
          document.getElementById("demo").innerHTML = age;
     </script>
</body>
</html>
