<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>isArray()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Person = ["Ramu", "Shamu", "Rushil", "Dhoni"];

          document.getElementById("demo").innerHTML = Array.isArray(Person);
     </script>
</body>

</html>
