<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Multiply forEach Element</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Numbers = [10, 20, 30, 40, 50, 66];
          Numbers.forEach(Multiple);

          function Multiple(item, index, arr) {
               arr[index] = item * 10;
          }
          document.getElementById("demo").innerHTML = Numbers;
     </script>
</body>

</html>
