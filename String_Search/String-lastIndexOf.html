<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>String LastIndexOf</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "Please locate where 'locate' occurence";
          let lastindexof = text.lastIndexOf("locate");

          document.getElementById("demo").innerHTML = lastindexof;
     </script>
</body>

</html>
