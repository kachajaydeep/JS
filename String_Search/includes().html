<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Includes()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let txt = "Hello world, welcome to the universe.";
          let hmm = txt.includes("Hello");

          document.getElementById("demo").innerHTML = hmm;
     </script>
</body>

</html>
