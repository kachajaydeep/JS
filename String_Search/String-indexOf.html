<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Index-Of</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "Enter Your location Please! Here";
          let index = text.indexOf("location");
          document.getElementById("demo").innerHTML = index;
     </script>
</body>

</html>
