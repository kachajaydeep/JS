<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Globle Search Match Method</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "The rain in SPAIN stays mainly in the plain";
          let search = text.match(/ain/g);

          document.getElementById("demo").innerHTML = search.length + " " +search;
     </script>
</body>

</html>
