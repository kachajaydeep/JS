<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Parameter Regular Expression</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "I love Coffee!, I love OH, I love lovely";
          let regExp = text.matchAll(/love/g);

          document.getElementById("demo").innerHTML = Array.from(regExp);
     </script>
</body>

</html>
