<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>EndsWith()</title>
</head>
<body>
     <p id="demo"></p>
     <p id="demo1"></p>
     <script>
          let text = "Hello world, welcome to the universe.";
          let ya = text.endsWith("universe.");

          document.getElementById("demo").innerHTML = ya;

          let txt = " ";
          document.getElementById("demo1").innerHTML = txt;
     </script>
</body>
</html>
