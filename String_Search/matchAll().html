<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>matchAll()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "The rain in SPAIN stays mainly in the plain";
          let matchall = text.matchAll("ain");

          document.getElementById("demo").innerHTML = Array.from(matchall);
     </script>
</body>

</html>
