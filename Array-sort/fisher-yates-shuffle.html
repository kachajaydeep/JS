<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Fisher-yates-shuffle</title>
</head>

<body>
     <p id="demo1"></p>
     <p id="demo2"></p>

     <button onclick="fisher()">Try this!</button>
     <script>
          const arr = [40, 100, 1, 5, 25, 10];
          document.getElementById("demo1").innerHTML = arr;
          function fisher() {

               for (let i = arr.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    let k = arr[i] // Permanent store the value at arr[i]  in variable k.
                    arr[i] = arr[j]; // moves the value of arr[j] to arr[i] at position i.
                    arr[j] = k; // store the value of k inside arr at index j.
               }
               document.getElementById("demo2").innerHTML = arr;
          }
     </script>
</body>

</html>
