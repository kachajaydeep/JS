<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Numeric Sorting</title>
</head>

<body>
     <p id="demo1"></p>
     <p id="demo2"></p>
     <script>
          const myarr = [40, 100, 1, 5, 25, 10];
          document.getElementById("demo1").innerHTML = myarr;

          myarr.sort(function (a, b) { return a - b });
          document.getElementById("demo2").innerHTML = myarr;
     </script>
</body>

</html>
