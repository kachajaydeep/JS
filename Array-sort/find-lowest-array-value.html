<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Find Lowest Array Value</title>
</head>

<body>
     <p id="demo"></p>
     <p>The Lowest Number is <span id="demo1"></span></p>

     <script>
          const points = [40, 100, 1, 5, 25, 10];
          document.getElementById("demo").innerHTML = points;
          points.sort(function Sort(a, b) { return a - b; });
          document.getElementById("demo1").innerHTML = points[0];

     </script>
</body>

</html>
