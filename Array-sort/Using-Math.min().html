<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Using Math Min()</title>
</head>

<body>
     <p id="demo"></p>
     <script>
          const arr = [1, 2, 3, 10, 15, 40, 50, 60, 70, 80, 90];
          document.getElementById("demo").innerHTML = myArray(arr);

          function myArray(array) {
               return Math.min.apply(null, array);
          }
     </script>
</body>

</html>
