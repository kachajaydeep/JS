<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>toreversed()</title>
</head>
<body>
     <p id="demo1"></p>
     <p id="demo2"></p>
     
     <script>
          const months = ["Jan","Feb","March","April"];
          const sorted = months.toSorted();
          document.getElementById("demo1").innerHTML = months;
          document.getElementById("demo2").innerHTML = sorted;
     </script>
</body>
</html>
