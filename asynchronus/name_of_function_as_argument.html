<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Name Of Function As Argument</title>
</head>

<body>
     <p>Name of Function as a Argument.</p>
     <p id="demo"></p>

     <script>
          setTimeout(function () { myFunction("I love JAVA") }, 3000);

          function myFunction(value) {
               document.getElementById("demo").innerHTML = value;
          }
     </script>
</body>

</html>
