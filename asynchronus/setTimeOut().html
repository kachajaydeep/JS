<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>setTimeOut()</title>
</head>

<body>

     <script>
          console.log("I");
          console.log("Ice Cream");
          console.log("with a Spoon");

          setTimeout(() => {
               console.log("Eat");
          },3000);

     </script>
</body>

</html>
