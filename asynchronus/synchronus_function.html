<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Synchronus Function</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          function grate(name) {
               return `My name is a ${name}`;
          };

          const name = "KJ";
          const callfunc = grate(name);

          document.getElementById("demo").innerHTML = callfunc;
     </script>
</body>

</html>
