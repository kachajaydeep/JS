<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>setTimeOut Example1</title>
</head>

<body>
     <p>Please Wait 3 seconds.</p>
     <p id="demo"></p>

     <script>
          setTimeout(myFunction, 3000);

          function myFunction() {
               document.getElementById("demo").innerHTML = "I Love JavaScript also Java."
          }
     </script>
</body>

</html>
