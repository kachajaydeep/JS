<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Clone</title>
</head>

<body>
     <script>
          function fetch(callback) {
               setTimeout(() => {
                    const Data = {
                         name: "hama",
                         age: 25
                    };
                    callback(Data);
               }, 3000);
          };

          fetch(function (Data) {
               console.log(Data);
          });

          console.log("Fetching Data...");
     </script>
</body>

</html>
