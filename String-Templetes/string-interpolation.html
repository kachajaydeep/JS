<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>String-interpolation</title>
</head>
<body>
     <p id="demo"></p>
     <p>Automatic replacing of expressions with real values is called string interpolation</p>
     <script>
          let f_Name = "john";
          let l_Name = "cena";
          document.getElementById("demo").innerHTML = `WelCome ${f_Name} ${l_Name}`;
     </script>
</body>
</html>
