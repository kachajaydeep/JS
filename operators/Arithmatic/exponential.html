<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Exponential</title>
</head>

<body>
     <p id="demo"></p>
     <p id="demo1"></p>
     <script>
          let x = 3
          let y = x ** 3
          document.getElementById("demo").innerHTML = y;

          // using math function
          document.getElementById("demo1").innerHTML = Math.pow(x, 4);
     </script>
</body>

</html>
