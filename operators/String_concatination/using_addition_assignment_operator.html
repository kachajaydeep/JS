<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>using_addition_assignment_operator</title>
</head>
<body>
     <h1>We can do concatination and generate space between to string using <b>+= operator</b></h1>
     <p id="demo"></p>
     <script>
          let x = "Tim-Berner-Lee";
          x += " Inveted WWW and also Inveted HTML.";
          document.getElementById("demo").innerHTML = x;
     </script>
</body>
</html>
