<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Nullish_coalescing</title>
</head>
<body>
     <h1>Here it's used between two values</h1>
     <p>If first value is null or a undefine then second value used!</p>
     <p id="demo"></p>
     <script>
          let x;
          document.getElementById("demo").innerHTML = x ??= 5;
     </script>
</body>
</html>
