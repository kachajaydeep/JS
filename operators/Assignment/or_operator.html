<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>or_operator</title>
</head>

<body>
     <p id="demo"></p>
     <script>
          let x = 100; //1100100
          x |= 5; //101
          //answer 1101101 means 101
          document.getElementById("demo").innerHTML = x;
     </script>
</body>

</html>
