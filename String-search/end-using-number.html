<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ends Using Number</title>
</head>
<body>
     <p id="demo"></p>
     <p>Check in the 11 first charecter of a String ends with "World".</p>

     <script>
          let text = "Hello World, welcome to the universe.";
          document.getElementById("demo").innerHTML = text.endsWith("World", 11);
     </script>
</body>
</html>
