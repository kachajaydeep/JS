<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Match</title>
</head>

<body>
     <p id="demo"></p>
     <script>
          let text = "The rain in SPAIN mainly in the spain";
          const myArr = text.match("mainly");
          document.getElementById("demo").innerHTML = myArr.length + " " + myArr;
     </script>
</body>

</html>
