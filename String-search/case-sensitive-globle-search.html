<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Globle Search for Case Sensitive</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let text = "The rain in SPAIN stays mainly in the plain";
          const globle = text.match(/ain/gi);
          document.getElementById("demo").innerHTML = globle.length + " " + globle;
     </script>
</body>
</html>
