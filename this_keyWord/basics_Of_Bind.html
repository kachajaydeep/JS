<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Basics Of Bind</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Teacher = {
               firstName: "Sanchit",
               lastName: "Jain",
               fullName: function () {
                    return this.firstName + " " + this.lastName;
               }
          };

          const Student = {
               firstName: "Hello",
               lastName: "World",
          }

          let fullName = Teacher.fullName.bind(Student);
          document.getElementById("demo").innerHTML = fullName();
     </script>
</body>

</html>
