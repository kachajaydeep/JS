<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Strict Mode as a Window Object</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          "use strict";
          let x = this;
          document.getElementById("demo").innerHTML = x;
     </script>
</body>

</html>
