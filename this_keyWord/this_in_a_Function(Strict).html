<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>This In a Function(Strict)</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          "use strict";

          document.getElementById("demo").innerHTML = myFunction();

          function myFunction() {
               return this;
          }
     </script>
</body>

</html>
