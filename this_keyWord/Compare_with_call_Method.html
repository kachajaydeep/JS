<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Compare with call Method</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const person = {
               fullName: function (city, state) {
                    return this.firstName + " " + this.lastName + " , " + city + " , " + state;
               }
          }

          const person1 = {
               firstName: "John",
               lastName: "Doe"
          }

          document.getElementById("demo").innerHTML = person.fullName.call(person1, ["Rajkot", "Gujarat"]);   
     </script>
</body>

</html>
