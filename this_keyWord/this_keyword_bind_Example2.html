<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>This Keyword Bind Example2</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Person = {
               firstName: "John",
               lastName: "Doe",
               id: 5556,
               fullName: function () {
                    return this.firstName + " " + this.lastName;
               }
          }

          document.getElementById("demo").innerHTML = Person.fullName();
     </script>
</body>

</html>
