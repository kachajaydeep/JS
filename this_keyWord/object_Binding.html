<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Binding</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Person = {
               firstName: "John",
               lastName: "Doe",
               id: 5555,
               myFunction: function () {
                    return this;
               }
          }
          document.getElementById("demo").innerHTML = Person.myFunction();
     </script>
</body>

</html>
