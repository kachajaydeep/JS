<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Person1 call Person2</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Person1 = {
               fullName: function() {
                   return this.firstName + " " + this.lastName;
               }
          }

          const Person2 = {
               firstName: "John",
               lastName: "Doe",
               age: 23
          }

          let x = Person1.fullName.call(Person2);
          document.getElementById("demo").innerHTML = x;
     </script>
</body>

</html>
