<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Bind Preventing this</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const person = {
               firstName: "John",
               lastName: "Doe",
               display: function () {
                    let x = document.getElementById("demo");
                    x.innerHTML = this.firstName + " " + this.lastName;
               }
          }

          person.display()
     </script>
</body>

</html>
