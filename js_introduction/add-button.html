<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Add Button</title>
     <link rel="stylesheet" href="./add-button.css">
</head>

<body>
     <button>Player 1 : Siri</button>

     <script>
          function toChange() {
               const name = prompt("Enter The Player Name: ");
               if (!name) {
                    toChange();
               }
               else {
                    button.textContent = `Player 1: ${name}`;
               }
          }

          const button = document.querySelector("button");
          button.addEventListener("click", toChange)
     </script>
</body>

</html>
