<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Max-Value</title>
</head>
<body>
     <p id="demo"></p>
     <p>It is Represented Largest Possible Value in the Javascript.</p>

     <script>
          let x = Number.MAX_VALUE;
          document.getElementById("demo").innerHTML = x;
     </script>
</body>
</html>
