<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>forEach()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const letters = new Set(["a", "b", "c"]);

          let text = "";
          letters.forEach(function (values) {
               text += values + "<br>";
          });

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
