<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Breaking Return Statement</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          document.getElementById("demo").innerHTML = myFunction(65);
          function myFunction(a) {
               let power = 10;
               return a * power
          }
     </script>
</body>

</html>
