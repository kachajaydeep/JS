<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Boolean assignment</title>
</head>

<body>
     <p>Assignment always returns the value of the assignment.</p>
     <p id="demo"></p>

     <script>
          let x = 0;
          document.getElementById("demo").innerHTML = Boolean(x = 0);
     </script>
</body>

</html>
