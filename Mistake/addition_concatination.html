<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>addition and Concatination</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let x = 10;
          x += 5;
          let y = 10;
          y += "5";

          document.getElementById("demo").innerHTML = "x is a " + x + " and y is a " + y;
     </script>
</body>

</html>
