<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>not_undefined_and_not_null</title>
</head>
<body>
     <p>If You want to test if an Object is not null, you must test if it is not Undefined first.</p>
     <p id="demo"></p>

     <script>
          document.getElementById("demo").innerHTML = typeof myObj !== "undefined" && myObj !== null;
     </script>
</body>
</html>
