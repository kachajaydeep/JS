<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>negative slice remaining</title>
</head>
<body>
     <p id="demo"></p>
     <p>Extract Part Of String From Position.</p>

     <script>
          let text = "Apple, Banana, Kiwi";
          let y = text.slice(-12);
          document.getElementById("demo").innerHTML = y;
     </script>
</body>
</html>
