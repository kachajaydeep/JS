<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>charAt()</title>
</head>
<body>
     <p id="demo"></p>
     <p>The charAt() Methods returns the charecter at a given position in a String.</p>
     <script>
          var text = "HELLO WORLD";
          document.getElementById("demo").innerHTML = text.charAt(0);
     </script>
</body>
</html>
