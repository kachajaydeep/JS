<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>toUpperCase()</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let x = "hello world";
          let y = x.toUpperCase();

          document.getElementById("demo").innerHTML = y;
     </script>
</body>
</html>
