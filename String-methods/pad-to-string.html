<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Pad_to_String</title>
</head>
<body>
     <p id="demo"></p>

     <script>
           let numb = 68;
           let text = numb.toString();
           document.getElementById("demo").innerHTML = text.padStart(10,"X");
     </script>
</body>
</html>
