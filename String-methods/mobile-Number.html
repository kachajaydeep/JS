<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Mobile Number</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let text = "55";
          document.getElementById("demo").innerHTML = "Please Enter Your Mobile Number: "+ text.padStart(10,"x");
     </script>
