<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Replace String</title>
</head>
<body>
     <p style="font-size: 30px;"><b>replace method cann't <mark>modify String</mark> alway it's return a <mark>new String.</mark></b></p>
     <p>Replace method Replace a Specified value with another value in string.</p>
     <p id="demo"></p>

     <script>
          let text = "Please Visit MicroSoft!";
          let newText = text.replace("MicroSoft","Oracle");

          document.getElementById("demo").innerHTML = newText;
     </script>
</body>
</html>
