<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>toLowerCase()</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let text = "HELLO WORLD";
          let y = text.toLowerCase();
          document.getElementById("demo").innerHTML = y;
     </script>
</body>
</html>
