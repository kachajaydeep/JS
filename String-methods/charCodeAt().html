<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>CharCodeAt()</title>
</head>
<body>
     <p id="demo"></p>
     <p>charAt() method returns the unicode of the charecter at a given position in a string.</p>
     <p>It's not use negative value in this method.</p>
     <script>
          let x = "HELLO hOW ARE YOU?";
          let y = x.charCodeAt(0);
          document.getElementById("demo").innerHTML = y;
     </script>
</body>
</html>
