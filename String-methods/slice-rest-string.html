<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>slice-rest-string</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let x = "Apple ,Kiwi, Mango";
          let y = x.slice(5);
          document.getElementById("demo").innerHTML = y;
     </script>
</body>
</html>
