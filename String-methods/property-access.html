<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Property Access</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "HELLO WORLD";
          let char = text[4]; //If not found then return undefine
          document.getElementById("demo").innerHTML = char;
     </script>
</body>

</html>
