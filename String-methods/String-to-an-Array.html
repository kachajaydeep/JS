<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>String to an Array</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "a,b,c,d,e,f";
          const myArray = text.split(",");
          document.getElementById("demo").innerHTML = myArray[0];
     </script>
</body>

</html>
