<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>PadEnd()</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let text = "50";
          let paded = text.padEnd(8,"x");
          document.getElementById("demo").innerHTML = paded;
     </script>
</body>
</html>
