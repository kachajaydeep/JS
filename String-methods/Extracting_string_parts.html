<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Extracting String Parts in String.</title>
</head>

<body>
     <p id="demo"></p>
     <p id="demo1"></p>
     <script>
          let text = "Apple, Banana, Kiwi";
          let part = text.slice(7, 13);
          let lengthWithExtract = text.substr(0, 5);
          document.getElementById("demo").innerHTML = part;
          document.getElementById("demo1").innerHTML = lengthWithExtract;
     </script>
</body>

</html>
