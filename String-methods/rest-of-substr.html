<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Rest Of String</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let str = "Apple, Banana, Kiwi";
          let y = str.substr(7);
          document.getElementById("demo").innerHTML = y;
     </script>
</body>
</html>
