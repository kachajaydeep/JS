<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>replace case-sensitive</title>
</head>

<body>
     <p>the replace method is case-sensitive.</p>
     <p id="demo"></p>

     <script>
          let text = "Please visit Microsoft!"
          let change = text.replace("MICROSOFT!", "Oracle");
          document.getElementById("demo").innerHTML = change;
     </script>
</body>

</html>
