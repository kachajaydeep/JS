<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Repeate()</title>
</head>
<body>
     <p id="demo"></p>
     <p>repeate KeyWords is Gives Number of Copy of the String.</p>

     <script>
          let text = "Hello World";
          let result = text.repeat(3);

          document.getElementById("demo").innerHTML = result;
     </script>
</body>
</html>
