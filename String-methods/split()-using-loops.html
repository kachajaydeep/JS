<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Split-Method Using Loops</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "Hello How Do Yoy Do!";
          const myArr = text.split("");

          text = "";
          for (let i = 0; i < myArr.length; i++) {
               text += myArr[i] + "<br>";
          }
          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
