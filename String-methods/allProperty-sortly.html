<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>JavaScript String Methods</title>
</head>

<body>
     <p>Note That all Strings are Immutable(Which means they are not changed).only replaced, They Don't Modify the Original String.</p>
     <p id="demo"></p>
     <p id="demo1"></p>
     <p id="demo2"></p>
     <p id="demo3"></p>
     <p id="demo4"></p>

     <script>
          let text = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
          document.write(text);
          document.getElementById("demo").innerHTML = text.length;
          document.getElementById("demo1").innerHTML = text.charAt(0); //method Returns a character at a Specified index(Position) in a String.
          document.getElementById("demo2").innerHTML = text.at(-2); // Introduced the String Method at ES2022,
          //  It is also allows the use of negative indexes while charAt() do not.
          document.getElementById("demo3").innerHTML = text[0]; //It's represent like array but they are not,
          //  [] not character found returns undefined, while charAt() returns empty String. It is ReadOnly.
          document.getElementById("demo4").innerHTML = text.charCodeAt(2); //charCode methods returns the code of the character at a Specified index in a String.
     </script>
</body>

</html>
