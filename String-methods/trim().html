<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Trim()</title>
</head>
<body>
     <p>The Trim() Method Removes the white Spaces both side of the String.</p>
     <p id="demo"></p>
     <script>
          let text = " Hello world  ";
          let text1 = text.trim();
          document.getElementById("demo").innerHTML = text1;
     </script>
</body>
</html>
