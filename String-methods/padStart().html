<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>PadStart()</title>
</head>

<body>
     <p>The padStart() method pads a string from the start.</p>
     <p>It pads the string with another strings (multiple times)until it reaches a given length.</p>
     <p id="demo"></p>

     <script>
          let text = "5";
          text = text.padStart(4,"1");

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
