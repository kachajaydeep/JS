<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>By Using New Keyword</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Person = new Array();

          Person[0] = "Rohan";
          Person[1] = "Mohan";
          Person[2] = "Shyamu";

          document.getElementById("demo").innerHTML = Person;
     </script>
</body>

</html>
