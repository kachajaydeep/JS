<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>valueof()</title>
</head>
<body>
     <p id="demo"></p>
     <script>
          let x = 10;
          console.log(typeof x);
          document.getElementById("demo").innerHTML =
           x.valueOf() + "<br>" + 
           (123).valueOf() + "<br>" + 
           (123 +20).valueOf();
           console.log(typeof x);
     </script>
</body>
</html>
