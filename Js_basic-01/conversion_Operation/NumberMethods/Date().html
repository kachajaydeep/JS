<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Date to number</title>
</head>

<body>
     <p id="demo"></p>
     <script>
          let x = new Date("1970-01-02");
          document.getElementById("demo").innerHTML = Number(x);
     </script>
</body>

</html>
