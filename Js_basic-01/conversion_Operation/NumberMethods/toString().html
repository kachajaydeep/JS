<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Conversion_Method</title>
</head>
<body>
     <p><b>Note:</b> toString() Methods are returns Number as a String (means it converts integer value  into numbers)</p>
     <p id="demo"></p>
     <script>
          let x =123;

          document.getElementById("demo").innerHTML =
          x.toString() +(12345).toString();
     </script>
</body>
</html>
