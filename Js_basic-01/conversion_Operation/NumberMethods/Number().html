<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Number()</title>
</head>
<body>
     <h1>Number() Method is also converts JavaScript Variables to Numbers</h1>
     <p id="demo"></p>
     <script>
          document.getElementById("demo").innerHTML=
          Number("10.11") + Number(true);
     </script>
</body>
</html>
