<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ToFixed()</title>
</head>
<body>
     <p>It's Calculate and Converts round Figure Number as a string</p>
     <p id="demo"></p>
     <script>
          let x = 9.656;
          document.getElementById("demo").innerHTML= 
          x.toFixed(0) + 
          x.toFixed(1) + 
          x.toFixed(2) + 
          x.toFixed(4) + 
          x.toFixed(6);
     </script>
</body>
</html>
