<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document Using HTML Title </title>
</head>

<body>
     <h2>Finding HTML Element Using document.title</h2>
     <p id="demo"></p>

     <script>
          document.getElementById("demo").innerHTML =
               "The Title of this document is: " + document.title;
     </script>
</body>

</html>
