<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Finding HTML Element By Tag Name</title>
</head>

<body>
     <p>Finding HTML Element By Tag Name.</p>
     <p>This Example demonstrates the <b>getElementByTagName</b> method.</p>

     <p id="demo"></p>

     <script>
          const element = document.getElementsByTagName("p");
          document.getElementById("demo").innerHTML =
               "You are Selected Element Using getElementByTagName : " + element[0].innerHTML;
     </script>
</body>

</html>
