<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>NodeList Property</title>
</head>
<body>
     <h2>JavaScript HTML DOM</h2>
     <p>Hello World!</p>
     <p>Hello norway!</p>
     <p id="demo"></p>
     
     <script>
          const element = document.querySelectorAll("p");
          document.getElementById("demo").innerHTML =
          "The Element is a : " + element[1].innerHTML;     
     </script>
</body>
</html>
