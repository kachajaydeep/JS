<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Animation Using JavaScript</title>

     <style>
          #container{
               position: relative;
               width: 400px;
               height: 400px;
               background-color: yellow;
          }
          #animate{
               position: absolute;
               width: 40px;
               height: 40px;
               background-color: red;
          }
     </style>
</head>
<body>
     <div id="container">
          <div id="animate"></div>
     </div>
</body>
</html>
