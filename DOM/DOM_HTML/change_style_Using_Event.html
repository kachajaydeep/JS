<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Change Style Using Event</title>
</head>

<body>
     <h1 id="head">Hello I am Heading.</h1>

     <button onclick="document.getElementById('head').style.color = 'blue'">Change Heading Color.</button>
</body>

</html>
