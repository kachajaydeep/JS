<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Change Text Color</title>
</head>
<body>
     <h2>JavaScript HTML DOM.</h2>
     <p>Hello World!</p>
     <p>Hello NorWay!</p>
     <p>Click To change the Color of Text.</p>
     <button onclick="myFunction()">Try</button>

     <script>
          function myFunction(){
               const myCollaction = document.getElementsByTagName("p");
               for(let i =0; i< myCollaction.length; i++){
                    myCollaction[i].style.color ="red";
               }
          }
     </script>
</body>
</html>
