<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Collaction Length</title>
</head>

<body>
     <h2>JavaScript HTML DOM</h2>
     <p>Hello world!</p>
     <p>Hello Nowdays!</p>
     <p id="demo"></p>

     <script>
          const myCollaction = document.getElementsByTagName("p");
          document.getElementById("demo").innerHTML = "This document Contains " + myCollaction.length + " Paragraph."
     </script>
</body>

</html>
