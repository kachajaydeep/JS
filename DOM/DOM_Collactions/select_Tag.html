<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Select Tag</title>
</head>
<body>
     <h2>Javascript HTML DOM..</h2>

     <p>Hello World.</p>
     <p>Hello Rajasthan</p>
     <p id="demo"></p>

     <script>
          const myCollaction = document.getElementsByTagName("p");

          document.getElementById("demo").innerHTML = 
          "Hello how are you? " + myCollaction[1].innerHTML;
     </script>
</body>
</html>
