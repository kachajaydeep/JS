<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Retrive Element With Example</title>
</head>
<body>
     <h1 id="id01"></h1>
     <p id="id02">Hello We are Siblings!</p>

     <script>
          document.getElementById("id01").innerHTML =
          document.getElementById("id02").firstChild.nodeValue;
     </script>
</body>
</html>
