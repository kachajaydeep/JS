<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>You Can Access Event Elements</title>
</head>

<body>
     <p id="demo">Click the Button to Display the Date.</p>
     <button onclick="toChange()">Click To change.</button>

     <script>
          function toChange() {
               document.getElementById("demo").innerHTML = Date();
          }
     </script>
</body>

</html>
