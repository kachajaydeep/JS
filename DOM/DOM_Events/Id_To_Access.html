<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Id To Access</title>
</head>

<body>
     <h2 onclick="changeText(this)">Click To change Text.</h2>

     <script>
          function changeText(id) {
               id.innerHTML = "OK You Change This Text!";
          }
     </script>
</body>

</html>
