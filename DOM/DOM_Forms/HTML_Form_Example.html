<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>HTML Form Example</title>
     <script>
          function validationForm() {
               let x = document.forms["myForm"]["myText"].value;
               if (x == "") {
                    alert("Please enter The filed");
                    return false;
               }
          }
     </script>
</head>

<body>
     <form action="./action.php" name="myForm" onsubmit="return validationForm()">
          Name: <input type="text" name="myText">
          <input type="submit" value="submit">
     </form>
</body>

</html>
