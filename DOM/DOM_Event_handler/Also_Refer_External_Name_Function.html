<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Also Refer External Name Function</title>
</head>
<body>
     <p>You can also refers to External Name Function.</p>
     <button id="myBtn">Try It</button>

     <script>
          document.getElementById("myBtn").addEventListener("click",myFunction);

          function myFunction(){
               alert("Hello, Java!");
          }
     </script>
</body>
</html>
