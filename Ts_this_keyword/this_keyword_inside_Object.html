<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>This Keyword Inside Object</title>
</head>

<body>
     <script>
          const employee = {
               id: "A5778",
               firstName: "Alex",
               lastName: "B",

               returnThis: function () {
                    return this;
               }
          }

          console.log(employee.id);
          console.log(employee.returnThis());
     </script>
</body>

</html>
