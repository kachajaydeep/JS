<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Nested Function</title>
</head>

<body>

     <script>
          const obj = {
               somekey: 1,
               outer: function () {
                    function inner() {
                         console.log(this);
                    }
                    inner();
               },
          }

          obj.outer();
     </script>
</body>

</html>
