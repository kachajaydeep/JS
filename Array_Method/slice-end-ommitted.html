<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Slice end Omitted</title>
</head>

<body>
     <p>The Slice out a Part of an array Starting from array element 2</p>
     <p id="demo"></p>

     <script>
          const fruits = ["Banana", "Orange", "Lemon", "Apple", "Mango"];
          const cruits = fruits.slice(2);
          document.getElementById("demo").innerHTML = fruits + "<br>" + cruits;
     </script>
</body>

</html>
