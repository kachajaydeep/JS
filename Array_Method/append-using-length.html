<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>append Element Using length property</title>
</head>

<body>
     <p id="demo1"></p>
     <p id="demo2"></p>

     <script>
          const animal = ["Tiger", "Lion", "Cow", "goat"];
          document.getElementById("demo1").innerHTML = animal;

          animal[animal.length] = "Elephent";
          document.getElementById("demo2").innerHTML = animal;
     </script>
</body>

</html>
