<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Slice Fundamental</title>
</head>

<body>
     <p id="demo"></p>
     <p>slice out a part of an array starting </p>
     <script>
          const animal = ["cow", "horse", "lion", "dog", "goat"];
          const cites = animal.slice(3);
          document.getElementById("demo").innerHTML = animal + "<br><br>" + cites;
     </script>
</body>

</html>
