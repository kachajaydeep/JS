<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Slice Argument</title>
</head>

<body>
     <p id="demo"></p>
     <p>Slice Method can take two arguments</p>
     <script>
          const fruits = ["Banana", "Orange", "grabs", "Mango"];
          const citrus = fruits.slice(0, 3);
          document.getElementById("demo").innerHTML = citrus;
     </script>
</body>

</html>
