<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Slice an Array</title>
</head>

<body>
     <b>
          <p>Slice() Methods are used to slice out array.</p>
     </b>
     <p>Slice out a part of an array starting from array element 1</p>
     <p id="demo"></p>
     <script>
          const notsliced = ["Banana", "Mango", "Grabs", "waterMelon"];
          const arr2 = notsliced.slice(1);
          document.getElementById("demo").innerHTML = notsliced + "<br><br>" + arr2;
     </script>
</body>

</html>
