<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Array Access</title>
</head>

<body>
     <p>Array Element are accessed using their index Number:</p>
     <p id="demo1"></p>
     <p id="demo2"></p>


     <script>
          const games = ["vice City", "Minecraft", "Clash of Clans"];
          document.getElementById("demo1").innerHTML = games;

          games[2] = "FreeFire";
          document.getElementById("demo2").innerHTML = games;
     </script>
</body>

</html>
