<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>array-toString</title>
</head>

<body>
     <p id="demo"></p>
     <p id="demo1"></p>

     <script>
          const leavingbeings = ["animal", "humans", "beckteria", "trees"];

          document.getElementById("demo").innerHTML = leavingbeings.toString();
          document.getElementById("demo1").innerHTML = typeof leavingbeings;
     </script>
</body>

</html>
