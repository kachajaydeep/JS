<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Pop() Method Return Value</title>
</head>

<body>
     <p id="demo1"></p>
     <p id="demo2"></p>

     <script>
          const fruits = ["banana","grabs","Mango","cherry"];
          document.getElementById("demo1").innerHTML = fruits.pop();
          document.getElementById("demo2").innerHTML = fruits;
     </script>
</body>

</html>
