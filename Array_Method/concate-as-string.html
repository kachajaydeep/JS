<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Concate-as-string</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const myArray = ["john", "cena"];
          const mychild = myArray.concat("hey!")
          document.getElementById("demo").innerHTML = mychild;
     </script>
</body>

</html>
