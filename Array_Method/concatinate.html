<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Concatinate()</title>
</head>

<body>
     <p>The Concate() Method merges Arrays:</p>
     <p id="demo"></p>

     <script>
          const os = ["Linux", "Android", "Ubuntu", "Neptune Os", "Ios"];
          const programming = ["c", "c++", "Java", "Python"];
          const CSE = programming.concat(os);

          document.getElementById("demo").innerHTML = CSE;
     </script>
</body>

</html>
