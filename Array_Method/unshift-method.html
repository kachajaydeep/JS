<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>UnShift method</title>
</head>

<body>
     <p>UnShift Method Returns the length of the the new </p>
     <p id="demo1"></p>
     <p id="demo2"></p>

     <script>
          const fruits = ["Banana", "Grabs", "Apple", "Mango"];
          document.getElementById("demo1").innerHTML = fruits.unshift("Lemon");
          document.getElementById("demo2").innerHTML = fruits;

     </script>
</body>

</html>
