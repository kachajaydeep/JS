<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>at()</title>
</head>
<body>
     <p>the at() method returns an indexed element from an array.</p>
     <p id="demo"></p>

     <script>
          const animals = ["Lion","tiger","horse"];
          let animal = animals.at(2);

          document.getElementById("demo").innerHTML = animal;
     </script>
</body>
</html>
