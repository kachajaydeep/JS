<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Splice()</title>
</head>

<body>
     <p>The Splice Method add new items to an array.</p>
     
     <b>
        <p>The first parameter (2) defines the position where new element should be added.</p>
     </b>

     <b>
         <p>The Second Parameter (0) defines the how many elements should be removed.</p>
     </b>

     <p id="demo"></p>

     <script>
          const animal = ["lion", "tiger", "cow"];
          animal.splice(2, 0, "Dog", "goat");
          document.getElementById("demo").innerHTML = animal;
     </script>
</body>

</html>
