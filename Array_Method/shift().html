<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Shift</title>
</head>

<body>
     <p>The Shift() Method removes the first Element of an array and makes other element as a lower indexes.</p>
     <p id="demo1"></p>
     <p id="demo2"></p>
     <p id="demo3"></p>

     <script>
          const fruits = ["Banana", "Orange", "Apple", "Grabs"];
          document.getElementById("demo1").innerHTML = fruits;
          fruits.shift();
          document.getElementById("demo2").innerHTML = fruits;
          document.getElementById("demo3").innerHTML = fruits[0];
     </script>
</body>

</html>
