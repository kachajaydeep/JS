<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Join Array Element into String.</title>
</head>

<body>
     <p>The Join Elemenet Join array Elements into String.</p>
     <p>It this example we have used " * " as a operator between each String.</p>
     <p id="demo"></p>

     <script>
          const fruits = ["banana", "lemon", "mango", "grabs"];
          document.getElementById("demo").innerHTML = fruits.join(" * ");
     </script>
</body>

</html>
