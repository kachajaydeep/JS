<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Copy With In</title>
</head>

<body>
     <p>Copy to index 2, all elements from index 0:</p>
     <p id="demo"></p>

     <script>
          const animal = ["Lion", "Tiger", "Cow", "Horse"];
          document.getElementById("demo").innerHTML = animal.copyWithin(2, 0);
     </script>
</body>

</html>
