<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Using New KeyWord</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const person = new Object();
          person.name = "Sunny Deol";
          person.age = 53;
          person.eyeColor = "Brown";

          document.getElementById("demo").innerHTML = 
          person.name + " " + person.age + "  " + person.eyeColor;
     </script>
</body>
</html>
