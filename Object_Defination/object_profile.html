<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Profile</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let Profile = {
               name: "tapas",
               company: "CreoWis",
               message: function () {
                    console.log(`${this.name} works at ${this.company}`);
               }
          }

          console.log(Profile.name);
          console.log(Profile.company);

     </script>
</body>

</html>
