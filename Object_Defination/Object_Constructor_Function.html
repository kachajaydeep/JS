<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Constructor Function</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          function Person(first, last, age, eye) {
               this.firstName = first;
               this.lastName = last;
               this.age = age;
               this.eyeColor = eye;
          }

          const myFriend = new Person("Joe", "Doe", 23, "Blue");
          document.getElementById("demo").innerHTML = myFriend.firstName + " " + myFriend.lastName;
     </script>
</body>

</html>
