<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Empty Javascript Object</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          function Person(first, last, age, eye) {
               this.firstName = first;
               this.lastName = last;
               this.age = age;
               this.eyeColor = eye;
               this.nationally = "Hindu";
          }
          const myFather = new Person("John", "Doe", 50, "blue");
          const myMother = new Person("Sally", "Rally", 48, "green");

          document.getElementById("demo").innerHTML =
               "My Father is " + myFather.nationally + ". My mother is " + myMother.nationally;
     </script>
</body>

</html>
