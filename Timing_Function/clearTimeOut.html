<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ClearTimeOut</title>
</head>
<body>
     <button onclick="myCar = setTimeout(myFunction,3000)">try Now</button>
     <button onclick="clearTimeout(myCar)">ClearTimeOut</button>
     <p id="demo"></p>

     <script>
          function myFunction() {
               alert("Hello");
          }
     </script>
</body>
</html>
