<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>at() Methods</title>
</head>
<body>
     <p>at() Methods returns index Element Like an array.</p>
     <p id="demo"></p>

     <script>
          const name = "W3Schools";
          let letter = name.at(-2); // It's also allows Negative Values.
          document.getElementById("demo").innerHTML = letter;
     </script>
</body>
</html>
