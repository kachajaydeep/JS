<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>String as Object</title>
</head>
<body>
     <p>Please note that not create String as an objects because It's gives unexcepted Output.</p>
     <p id="demo"></p>

     <script>
          let x = "John";
          let y = new String("John"); // because Create an Object Using new Keword.
          document.getElementById("demo").innerHTML = typeof x + "<br>" + typeof y;
     </script>
</body>
</html>
