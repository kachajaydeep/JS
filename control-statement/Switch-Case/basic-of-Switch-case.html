<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Basic Of Switch Case Condition</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let position = 4;

          switch (position) {
               case 1: document.write("Print 1 <br>");
                    break;
               case 2: document.write("Print 2 <br>");
                    break;
               case 3: document.write("Print 3 <br>");
                    break;
               case 4: document.write("Print 4 <br>");
                    break;
          }
     </script>
</body>

</html>
