<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>even-number</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let x = 4;
          if (x % 2 === 0) {
               document.getElementById("demo").innerHTML = "The Even Number is : " + x;
          }

          else {
               document.getElementById("demo").innerHTML = `The ${x} is a odd Number`;
          }
     </script>
</body>

</html>
