<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Grade-System</title>
</head>

<body>
     <!-- <p id="demo"></p> -->

     <script>
          let Score = 80;

          if (Score >= 90) {
               document.writeln("Grade A");
          }
          else if (Score >= 80) {
               document.writeln("Grade B");
          }
          else if (Score >= 70) {
               document.writeln("Grade C");
          }
          else if (Score < 70) {
               document.writeln("Fail");

          }
     </script>
</body>

</html>
