<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>UnderStand-If Concept</title>
</head>

<body>
     <script>
          let x = 0;

          if (x === 0) {
               document.write(0 + "<br>");
          }
          if (x <= 0) {
               document.write("Greater Then 0 <br>") ;
          }
          if (x >= 0) {
               document.write("Less Then 0");
          }
     </script>
</body>

</html>
