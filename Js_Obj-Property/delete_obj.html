<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Delete_Object</title>
</head>
<body>
     <p id="demo"></p>
     <script>
          const obj = {
               FirstName: "John",
               LastName:  "Doe",
               age: 23
          }

          delete obj["FirstName"];
          document.getElementById("demo").innerHTML = obj.FirstName +" " + obj.LastName + " "+ obj.age
     </script>
</body>
</html>
