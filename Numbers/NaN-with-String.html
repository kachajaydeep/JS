<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>NaN with String</title>
</head>

<body>
     <p>NaN with String to do Concatination.</p>
     <p id="demo"></p>

     <script>
          let x = NaN;
          let y = "5";
          document.getElementById("demo").innerHTML = x + y;
     </script>
</body>

</html>
