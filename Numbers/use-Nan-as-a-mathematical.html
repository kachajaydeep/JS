<body>
     <p>If we are use NaN with Mathematical Operation, The Result Will also be NaN.</p>
     <p id="demo"></p>

     <script>
          let x = NaN;
          let y = 5;
          let z = x + y;
          document.getElementById("demo").innerHTML = z;
     </script>
