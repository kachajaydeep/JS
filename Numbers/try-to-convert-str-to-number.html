<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Try To Convert Number to String</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let x = "10";
          let y = "20";
          let z = x / y;

          document.getElementById("demo").innerHTML = z;
     </script>
</body>

</html>
