<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>String Will Numeric</title>
</head>

<body>
     <p>If The String is Numeric, Result will be a Number.</p>
     <p id="demo"></p>

     <script>
          let x = 100 / "10";
          document.getElementById("demo").innerHTML = x;
     </script>
</body>

</html>
