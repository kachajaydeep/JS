<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>add String and Number</title>
</head>

<body>
     <p>add String with Number it will also give String.</p>
     <p id="demo"></p>

     <script>
          let x = "10";
          let y = 20;
          document.getElementById("demo").innerHTML = x + y;
     </script>
</body>

</html>
