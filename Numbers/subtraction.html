<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Subtraction</title>
</head>

<body>
     <p>JavaScript will Try to Convert String to Numbers When Subtracting.</p>
     <p id="demo"></p>
     <p id="demo1"></p>

     <script>
          let x = "100";
          let y = "10";
          let z = x - y;
          document.getElementById("demo").innerHTML = z;
          document.getElementById("demo1").innerHTML = typeof z;
     </script>
</body>

</html>
