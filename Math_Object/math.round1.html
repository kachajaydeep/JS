<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Math-Round</title>
</head>

<body>
     <p>Math.round(x) returns the value of x rounded to it's nearest Integer.</p>
     <p id="demo"></p>

     <script>
          document.getElementById("demo").innerHTML = Math.round(4.5);
     </script>
</body>

</html>
