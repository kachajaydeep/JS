<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>cosine angle</title>
</head>

<body>
     <p>Angle in radius = (angle in degrees) * PI / 180.</p>
     <p id="demo"></p>
     <script>
          document.getElementById("demo").innerHTML =
               "The cosine Value of 0 degree is " + Math.cos(0 * Math.PI / 180);
     </script>
</body>

</html>
