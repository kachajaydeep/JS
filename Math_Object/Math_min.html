<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Math_Min</title>
</head>

<body>
     <p>Math.min() returns the lowest value in a list of argument.</p>
     <p id="demo"></p>

     <script>
          document.getElementById("demo").innerHTML =
               Math.min(0, 150, 30, 20, -8, -200);
     </script>
</body>

</html>
