<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Prompt</title>
</head>

<body>
     <input type="button" onclick="check()" value="Please Check Your Eligiblity">
     <script>
          function check() {
               const Age = prompt("Enter Your Age!");

               if (Age < 18) {
                    alert("You are Not Eligible to vote!");
               }
               else {
                    alert("You are Eligible to vote!");
               }
          }
     </script>
</body>

</html>
