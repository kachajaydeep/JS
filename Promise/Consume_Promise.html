<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Consume Promise</title>
</head>

<body>

     <script>
          const myPromise = new Promise((resolve, reject) => {
               setTimeout(() => {
                    resolve("Hello Promise");
               }, 3000);
          });

          myPromise.then((result) => {
               console.log(result);
          })
               .catch((error) => {
                    console.log(error);
               });

     </script>
</body>

</html>
