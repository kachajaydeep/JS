<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Example Using Promise</title>
</head>

<body>
     <p>Please Wait Some Point Of time.</p>
     <p id="demo"></p>

     <script>
          const myPromise = new Promise(function (myResolve, myReject) {
               setTimeout(function () { myResolve("Hello How are You!!!") }, 3000)
          });

          myPromise.then(function (value) {
               document.getElementById("demo").innerHTML = value;
          });
     </script>
</body>

</html>
