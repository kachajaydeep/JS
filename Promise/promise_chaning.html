<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Promise Chaning</title>
</head>

<body>

     <script>
          fetchData()
               .then(data => {
                    return otherFetchData(data);
               })
               .then(chainData => {
                    return chainData.response;
               })
               .catch(error => {
                    console.log(error);
               })
     </script>
</body>

</html>
