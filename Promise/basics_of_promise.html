<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Basics Of Promise</title>
</head>

<body>
     <h1>Promise.then() takes two arguments, a callback for success and another for failure.</h1>
     <p id="demo"></p>

     <script>

          const myPromise = new Promise(function (myResolve, myReject) {
               let x = 0;

               if (x == 0) {
                    myResolve("The Output is Occured!");
               }
               else {
                    myReject("The Output is Not Occured!");
               }
          });

          myPromise.then(
               function (value) {
                    document.getElementById("demo").innerHTML = value;
               },
               function (error) {
                    document.getElementById("demo").innerHTML = error;
               }
          )
     </script>
</body>

</html>
