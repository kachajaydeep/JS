     <title>resolve console</title>
</head>

<body>
     <p>Promise has Three States</p>
     <p><b>Pending : </b>Initial State neighther fullfill or reject.</p>
     <p><b>Fullfilled : </b>meaning that an operation was Completed Successfully.</p>
     <p><b>Reject : </b>meaning that an operation Failed.</p>
     <script>
          const myPromise = new Promise((resolve, reject) => {
               setTimeout(() => {
                    resolve("Hello from the Promise!");
               }, 2000);
          });
     </script>
