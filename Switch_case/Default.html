<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Default</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text;
          switch (new Date().getDay()) {
               case 6:
                    text = "Today is Saturday";
                    break;

               case 0:
                    text = "Today is Sunday";
                    break;

               default:
                    text = "Looking forward";
          }
          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
