<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Getters and Setter Object</title>
</head>

<body>
     <p id="demo"></p>
     <script>
          const person = {
               firstName: "John",
               lastName: "Doe",
               language: "en",
               get lang() {
                    return this.language;
               }
          };

          document.getElementById("demo").innerHTML = person.lang;
     </script>
</body>

</html>
