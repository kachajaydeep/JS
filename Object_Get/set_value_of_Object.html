<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>set value of Object</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const person = {
               firstName: "John",
               lastName: "Doe",
               age: 23,
               language: "",
               set lang(lang) {
                    this.language = lang;
               }
          };

          person.lang = "Hind";

          document.getElementById("demo").innerHTML = person.language;
     </script>
</body>

</html>
