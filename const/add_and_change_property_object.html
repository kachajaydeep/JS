<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>add_and_change_property_object</title>
</head>

<body>
     <p>You can change the property of object.</p>
     <p id="demo"></p>
     <script>
          const car = {
               type: "Fiat",
               model: "500",
               color: "white"
          };
          car.color = "red";
          car.owner = "John son";
          document.getElementById("demo").innerHTML ="Cars owner is" + car.owner +" cars type is: "+  car.type;
     </script>
</body>

</html>
