<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>can't_reassign_objects</title>
</head>

<body>
     <p id="demo"></p>
     <script>
          try {
               const cars = {
                    Name: "RolsRoyal",
                    color: "black",
                    price: "10 milion"
               };
               cars = {
                    Name: "odi",
                    color: "white",
                    price: "10 billion"
               };
          }
          catch (e) {
               document.getElementById("demo").innerHTML = e;
          }
     </script>
</body>

</html>
