<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>You can do using const</title>
</head>

<body>
     <p>One thing is misleading with const that it's assign constant value but it's wrong because it's assign a constant
          reference to the value.</p>
     <p id="demo"></p>
     <script>
          const cars = ["volvo", "Bmw", "neno"];
          cars[0] = "rollsroyal";
          cars.push("farari");
          document.getElementById("demo").innerHTML = cars;

     </script>
</body>

</html>
