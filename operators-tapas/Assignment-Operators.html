<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Assignment Operators</title>
</head>

<body>
     <p id="demo"></p>
     <p id="demo1"></p>
     <p id="demo2"></p>
     <p id="demo3"></p>
     <p id="demo4"></p>

     <script>
          let x = 10;
          document.getElementById("demo").innerHTML = " let x = 10 => " + x;
          x += 5; // X = x + 5
          document.getElementById("demo1").innerHTML = " x = x + 5 => " + x;
          x -= 3; // x = x - 3
          document.getElementById("demo2").innerHTML = " x = x - 3 => " + x;
          x *= 2; // x = x * 2
          document.getElementById("demo3").innerHTML = " x = x * 3 => " + x;
          x /= 4; // x = x / 4
          document.getElementById("demo3").innerHTML = " x = x / 3 => " + x;

     </script>
</body>

</html>
