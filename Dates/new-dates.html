<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>New Dates</title>
</head>

<body>
     <p id="demo"></p>
     <p>Date Objects are Static. The "clock" is not "Running".</p>
     <p>The Computer clock is ticking, date objects are not.</p>

     <script>
          const d = new Date("2023-04-12");
          document.getElementById("demo").innerHTML = d;
     </script>
</body>

</html>
