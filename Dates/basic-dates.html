<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Basic Dates</title>
</head>

<body>
     <p>New Date() without argument, creates a date object with the current date and time:</p>
     <p id="demo"></p>

     <script>
          const d = new Date();
          document.getElementById("demo").innerHTML = d;
     </script>
</body>

</html>
