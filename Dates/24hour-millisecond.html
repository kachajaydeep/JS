<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>24 Hour For MilliSecond</title>
</head>

<body>
     <p>86400000 millisecond from January 01 1970 UTC is:</p>
     <p id="demo"></p>

     <script>
          const date = new Date(86400000);
          document.getElementById("demo").innerHTML = date;
     </script>
</body>

</html>
