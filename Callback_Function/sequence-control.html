<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Sequence Control</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          function displayNumbers(some) {
               document.getElementById("demo").innerHTML = some;
          }

          function Sumtions(num1, num2) {
               let numation = num1 + num2;
               return numation;
          }

          let result = Sumtions(30, 30);
          displayNumbers(result);
     </script>
</body>

</html>
