<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Function-Sequence</title>
</head>

<body>
     <p>A Callback Function Passed as an argument to the another Function. This technique allows a Function to call
          another function </p>
     <p>A call back Function can run after another function has finished.</p>
     <p id="demo"></p>

     <script>

          function onDisplay(some) {
               document.getElementById("demo").innerHTML = some;
          }
          function one() {
               onDisplay("Hello");
          }

          function two() {
               onDisplay("Goodbye");
          }
          one();
          two();
     </script>
</body>

</html>
