<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>myCalculator</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          function onDisplay(some) {
               document.getElementById("demo").innerHTML = some;
          }

          function myCalculator(num1, num2) {
               let sum = num1 + num2;
               onDisplay(sum);

          }
          myCalculator(60, 70);
     </script>
</body>

</html>
