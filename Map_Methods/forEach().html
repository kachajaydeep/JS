<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>forEach()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const cars = new Map([
               ["TATA", 100],
               ["Ford", 200],
               ["ODI", 300]
          ]);

          let text = "";
          cars.forEach(function (value, key) {
               text += key + '=' + value + "<br>";
          })

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
