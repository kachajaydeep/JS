<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>set()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const cars = new Map();
          cars.set("odi", 500);
          cars.set("farari", 200);
          cars.set("lion", 100);

          document.getElementById("demo").innerHTML = cars.get("odi");
     </script>
</body>

</html>
