<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Clear_Methods</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const cars = new Map([
               ["apple",200],
               ["banana",300],
               ["mango", 200]
          ]);

          cars.clear();

          document.getElementById("demo").innerHTML =cars.size;
     </script>
</body>
</html>
