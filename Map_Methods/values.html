<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Values()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const cars = new Map([
               ["Odi", 300000],
               ["farari", 350000],
               ["Bugadi", 600000]
          ]);

          let text = ""; 
          for (const x of cars.values()) {
               text += x + "<br>";
          }
          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
