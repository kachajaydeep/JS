<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Entries</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const cars = new Map([
               ["ODI", 200000],
               ["Farari", 100000],
               ["Bugadi", 300000]
          ]);

          let text = "";
          for (const x of cars.entries()) {
               text += x + "<br>";
          }

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
