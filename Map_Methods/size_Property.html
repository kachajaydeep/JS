<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Size Property</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = new Map([
               ["apple", 300],
               ["grabs", 100],
               ["banana", 100]
          ]);

          document.getElementById("demo").innerHTML = fruits.size;
     </script>
</body>

</html>
