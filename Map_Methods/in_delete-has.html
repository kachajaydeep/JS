<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>has()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const cars = new Map([
               ["ODI", 100],
               ["Orange", 200],
               ["Grabs", 600],
          ]);
          
          cars.delete("ODI");
          document.getElementById("demo").innerHTML = cars.has("ODI");
     </script>
</body>

</html>
