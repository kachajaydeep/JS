<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>clear console</title>
</head>

<body>
     <p>Click Button to Clear console</p>
     <button onclick="myFunction()">Press to clear</button>
     <script>
          console.log("Press Button and Make it Clear Console");

          function myFunction() {
               console.clear();
          }
     </script>
</body>

</html>
