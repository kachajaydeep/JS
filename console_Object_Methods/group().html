<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Create Group in Console</title>
</head>
<body>
     <p>The group() method starts a message group.</p>
     <script>
          console.log("Hello World");
          console.group();
          console.log("Hello again this time inside a Group!");
     </script>
</body>
</html>
