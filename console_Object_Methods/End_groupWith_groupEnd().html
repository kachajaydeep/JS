<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>End groupWith groupEnd()</title>
</head>

<body>
     <p>End a group by using the console.groupEnd() method.</p>

     <script>
          console.log("Hello World");
          console.group();
          console.log("Hello again, this time inside a group!");
          console.groupEnd();
          console.log("and We are back");
     </script>
</body>

</html>
