<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>assert()</title>
</head>

<body>
     <p>The assert() method writes a message to the console if an expression evaluates to false.</p>

     <script>
          let x = 5;
          let y = 5;
          console.assert(x + y == 11, "Expression returned 'false'");
     </script>
</body>

</html>
