<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Math Floor With Math Random</title>
</head>

<body>
     <p>Use Math Floor with Math random it's give us integer values 0 to 9.</p>
     <p id="demo"></p>

     <script>
          document.getElementById("demo").innerHTML =
               Math.floor(Math.random() * 10);
     </script>
</body>

</html>
