<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Function Sequence</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          function myDisplayer(some) {
               document.write(some + "<br>");
          }

          function myFirst() {
               myDisplayer("Hello");
          }

          function mySecond() {
               myDisplayer("GoodBye");
          }

          myFirst();
          mySecond();
     </script>
</body>

</html>
