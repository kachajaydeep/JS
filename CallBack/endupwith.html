<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Endup With</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          function myDisplayer(some) {
               document.writeln(some + "<br>");
          };

          function myFirst() {
               myDisplayer("hello");
          }

          function mySecond() {
               myDisplayer("nothing");
          }

          mySecond();
          myFirst();
     </script>
</body>

</html>
