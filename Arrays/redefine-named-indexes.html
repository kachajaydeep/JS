<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Redefine array Indexes</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const name = [];
          name["firstName"] = "rohan";
          name["secondName"] = "mohan";
          name["thirdName"] = "ramu";
          name["forthName"] = "shamu";
          document.getElementById("demo").innerHTML = name[0] + "  " + name.length;
     </script>
</body>

</html>
