<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Change value of Array Element</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const Person = ["chagan" , "magan" , "joe", "briden"];
          Person[2] = "Eich";
          document.getElementById("demo").innerHTML = Person
     </script>
</body>
</html>
