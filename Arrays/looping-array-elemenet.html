<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Looping Array Element</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = ["Banana", "Mango", "Grabs", "Orange"];
          let fLen = fruits.length; //copy length of an array.

          let text = "<ul>";

          for (i = 0; i <= fLen; i++) {
               text += "<li>" + fruits[i] + "</li>";
          }
          text += "<ul>";
               document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
