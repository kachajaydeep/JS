<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Array in Object</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const myObj = {
               name: "John",
               age: 30,
               cars: [
                    "rohan",
                    "mohan",
                    "ramu",
                    "shamu"
               ]
          };
          document.getElementById("demo").innerHTML = myObj.cars;
     </script>
</body>
</html>
