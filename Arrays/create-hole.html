<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Create Hole in Array</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = ["birds", "animals", "humans"];
          fruits[6] = "bings";

          let fel = fruits.length;
          let text = "";
          for (i = 0; i < fel; i++) {
               text += fruits[i] + "<br>";
          }
          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
