<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Last Array Element</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const fruits = ["Banana","grabs","orange","Mango"];

          document.getElementById("demo").innerHTML = fruits[fruits.length-4];
     </script>
</body>
</html>
