<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>forEach()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const array = ["tree", "table", "chair"];
          let text = "<ul>";
          array.forEach(myFunc);
          text += "</ul>"

          document.getElementById("demo").innerHTML = text;
          function myFunc(value) {
               text += "<li>" + value + "</li>";
          }
     </script>
</body>

</html>
