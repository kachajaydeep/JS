<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Create array with one</title>
</head>
<body>
     <p id="demo"></p>
     <p id="demo1"></p>
     <script>
          var points = new Array(12);
          var js = [12];
          document.getElementById("demo").innerHTML = points;
          document.getElementById("demo1").innerHTML = js;
     </script>
</body>
</html>
