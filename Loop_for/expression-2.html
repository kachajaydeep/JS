<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Expression 2</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const cars = ["Volvo", "BMW", "ODI", "RangeRower"];
          let i;
          let len = cars.length;
          let text = "";

          for (; i < len;) {
               text += cars.length + "<br>";
               i++;
          }
          document.getElementById("demo").innerHTML = i;
     </script>
</body>

</html>
