<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Arrow Shaped Pattern</title>
</head>

<body>
     <script>
          for (var i = 0; i < 5; i++) {
               for (var j = 0; j <= i; j++) {
                    document.write("* ");
               }
               document.write("<br>");
          }
          for (let k = 1; k < 5; k++) {
               for (let l = 4; l >= k; l--) {
                    document.write("* ");
               }
               document.write("<br>");
          }
     </script>
</body>

</html>
