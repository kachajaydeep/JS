<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Initialize many expression</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const name = ["ramu", "shamu", "rohan", "mohan","chagan"];
          let i;
          let len;

          for (i=0, len = name.length, text = ""; i < len; i++) {
               text += name[i] + "<br>";
          }

          document.getElementById("demo").innerHTML = text;
     </script>
</body>
</html>
