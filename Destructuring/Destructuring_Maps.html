<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Destructuring Maps</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = new Map([
               ["apples", 500],
               ["Banana", 400],
               ["Cherry", 600],
               ["Dog", 800]
          ]);

          let text = "";

          for (const [key, value] of fruits) {
               text += "<p>" + key + " is " + value;
          }

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
