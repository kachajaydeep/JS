<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Destructering</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const person = {
               firstName: "John",
               lastName: "Doe",
          };

          let { firstName, lastName } = person;

          document.getElementById("demo").innerHTML = firstName + " " + lastName;
     </script>
</body>

</html>
