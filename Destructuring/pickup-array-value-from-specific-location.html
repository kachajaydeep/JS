<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Pickup Array Value From Specific Location</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const arr = ["Apple", "Bubble Sort", "Cutting Tea", "DBMS", "DSA"];

          const { [0]: fruit1, [1]: fruit2 } = arr;
          document.getElementById("demo").innerHTML = fruit1 + " " + fruit2;
     </script>
</body>

</html>
