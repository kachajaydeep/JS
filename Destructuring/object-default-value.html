<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Default Value</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const person = {
               firstName: "John",
               lastName: "Doe",
               age: 30
          };

          let { firstName, lastName, country = "Germani" } = person;

          document.getElementById("demo").innerHTML = firstName + " " + lastName + " " + country;
     </script>
</body>

</html>
