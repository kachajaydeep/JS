<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Destructring Array</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const myArr = ["Apple", "Banana", "Cherry", "Grabs"];

          let [ fruit1, fruit2 ] = myArr;

          document.getElementById("demo").innerHTML = fruit1 + "       " + fruit2;
     </script>
</body>

</html>
