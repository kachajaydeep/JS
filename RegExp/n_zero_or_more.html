<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>n? Zero Or more</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "1, 100 or 1000?";
          let result = text.match(/10?/g);
          document.getElementById("demo").innerHTML = result;
     </script>
</body>

</html>
