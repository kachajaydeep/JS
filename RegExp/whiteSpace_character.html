<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>WhiteSpace Character</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let Sentence = "Coding is So Good Thing!";
          let result = Sentence.match(/\s/g);

          document.getElementById("demo").innerHTML = result;;
     </script>
</body>

</html>
