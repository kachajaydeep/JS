<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>n* Expression</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let text = "Hellooo World! Hello W3Schools!";
          let result = text.match(/o*/g);

          document.getElementById("demo").innerHTML = result;
     </script>
</body>
</html>
