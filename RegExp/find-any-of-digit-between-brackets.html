<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Find Any Of Digit Between Brackets</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "123456789";
          let result = text.match(/[1-4]/g);
          document.getElementById("demo").innerHTML = result;
     </script>
</body>

</html>
