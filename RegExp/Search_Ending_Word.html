<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Search Ending Word</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "HELLO, LOOK AT YOU!";
          let result = text.search(/LO\b/);
          document.getElementById("demo").innerHTML = result;
     </script>
</body>

</html>
