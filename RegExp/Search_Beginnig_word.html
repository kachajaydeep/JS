<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Beginning Word</title>
</head>

<body>
     <p>Search for the character "LO" in the <b>beginning</b> of a word in the phrase:</p>
     <p>"HELLO, LOOK AT YOU!"</p>
     <p id="demo"></p>

     <script>
          let text = "HELLO, LOOK AT YOU!";
          let result = text.search(/\bLO/);
          document.getElementById("demo").innerHTML = result;
     </script>
</body>

</html>
