<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Search With Example</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "Visit W3Schools";
          let n = text.search(/w3Schools/i);
          document.getElementById("demo").innerHTML = n;
     </script>
</body>

</html>
