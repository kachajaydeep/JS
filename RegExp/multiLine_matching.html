<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Multiline Matching</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "\nIs th\nis it?";
          let result = text.match(/^is/m);

          document.getElementById("demo").innerHTML = result;
     </script>
</body>

</html>
