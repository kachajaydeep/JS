<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Find Digit</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let value = "Give your 100%";
          let result = value.match(/\d/g);

          document.getElementById("demo").innerHTML = result;
     </script>
</body>
</html>
