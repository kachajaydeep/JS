<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Case Insensitive</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "Visit W3Schools!";
          let result = text.match(/w3schools/i);
          document.getElementById("demo").innerHTML = result;
     </script>
</body>

</html>
