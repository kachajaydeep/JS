<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>String Replace Method</title>
</head>
<body>
     <p>The Replace Method replaces a Specified value with another value in String.</p>
     <p id="demo"></p>

     <script>
          let text = "Visit Microsoft!";
          let result = text.replace(/Microsoft/i, "Any Company");

          document.getElementById("demo").innerHTML = result;
     </script>
</body>
</html>
