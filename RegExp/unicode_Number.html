<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Unicode Number</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let text = "HELLO W3Schools. Hello World!";
          let result = text.match(/\u0057/g);
          document.getElementById("demo").innerHTML = result;
     </script>
</body>

</html>
