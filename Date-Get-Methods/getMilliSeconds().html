<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>GeTMilliSeconds()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const date = new Date("2020-03-23");
          document.getElementById("demo").innerHTML = date.getMilliseconds();
     </script>
</body>

</html>
