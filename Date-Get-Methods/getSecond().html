<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>getSecond()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const d = new Date("2012-02-23");
          document.getElementById("demo").innerHTML = d.getSeconds();
     </script>
</body>

</html>
