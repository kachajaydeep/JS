<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>getHours()</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const d = new Date("2021-02-29");
          document.getElementById("demo").innerHTML = d.getHours();
     </script>
</body>
</html>
