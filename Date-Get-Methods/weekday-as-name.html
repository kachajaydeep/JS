<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>WeekDay-as-Name</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const days = ["Sunday", "Monday", "Thesday", "Wednesday", "Thursday", "Friday", "Saturday"];
          const d = new Date("2025-03-23");

          let day = days[d.getDay()];
          document.getElementById("demo").innerHTML = day;
     </script>
</body>

</html>
