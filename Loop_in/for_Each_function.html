<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>forEach()</title>
</head>

<body>
     <p id="demo"></p>
     <script>
          const number = [1, 2, 3, 4, 5, 6];


          let txt = "";
          number.forEach(func);
          document.getElementById("demo").innerHTML = txt;


          function func(value, index, array) {
               txt += value + "<br>";
          }

     </script>
</body>

</html>
