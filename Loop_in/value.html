<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>value</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const cars = ["odi", "farari", "rolls"];
          let txt = "";
          cars.forEach(Func);
          document.getElementById("demo").innerHTML = txt;

          function Func(value) {
               txt += value + "<br>";
          }
     </script>
</body>

</html>
