<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Looping_Over A String</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let language = "Javascript";

          let txt = "";
          for (const x of language) {
               txt += x + "<br>";
          }
          document.getElementById("demo").innerHTML = txt;
     </script>
</body>

</html>
