<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>for-in an Array</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const arr = [1, 2, 3, 4, 5, 6, 7];

          let txt = "";
          for (let x in arr) {
               txt += arr[x] + " ";
          }
          document.getElementById("demo").innerHTML = txt;
     </script>
</body>

</html>
