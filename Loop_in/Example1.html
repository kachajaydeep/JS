<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Loops in</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const person = {
               fname:"Joe",
               lname: "Doe",
               age: 50
          };
          
          let detail = "";

          for(let x in person){
               detail += person[x] + " ";
          }
          document.getElementById("demo").innerHTML = detail
     </script>
</body>
</html>
