<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>not_function_result</title>
</head>
<body>
     <h1>In this Example and above Example You can see that the <mark>toCelcious refers to the function object</mark> and <mark>toCelcious() refers to the function value</mark></h1>
     <h1>It not returns the function and without returns the function Value</h1>
     <p id="demo"></p>
     <script>
          function toCelcious(farenheit){
               return (5/9) * (farenheit-32);
          }
          let result = toCelcious;
          document.getElementById("demo").innerHTML = result;
     </script>
</body>
</html>
