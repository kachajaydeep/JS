<head>

     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>return</title>
</head>
<body>
     <p id="demo"></p>
     <script>
          function myFun(a ,b){
               return a * b;
               return a + b;  //it's not execute because here function wil stop executing.
          } 

          let result = myFun(4 , 6);
          document.getElementById("demo").innerHTML = result;
     </script>
