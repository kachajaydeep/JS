<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>nested_Objects</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const myObj = {
               name:"john",
               myFruits: {
                    fruit1:"Mango",
                    fruit2:"Banana",
                    fruit3:"grabs"
               }
          };
          document.getElementById("demo").innerHTML = myObj.myFruits["fruit2"];
     </script>
</body>
</html>
