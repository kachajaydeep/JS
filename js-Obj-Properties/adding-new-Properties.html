<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Adding New Properties</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const Person = {
               firstName:"John",
               LastName:"Doe",
               age:23
          };
          Person.email = "hitesh@google.com";

          document.getElementById("demo").innerHTML = Person.email;
     </script>
</body>
</html>
