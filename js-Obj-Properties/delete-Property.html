<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Delete-Object</title>
</head>
<body>
     <p id="demo"></p>
     <script>
          const person ={
               FirstName:"John",
               LastName:"Doe",
               age: 25,
          }

          delete person.FirstName;

          document.getElementById("demo").innerHTML = person.FirstName;
     </script>
</body>
</html>
