<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Named Class Expression</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const student = class Emp {
               constructor(name, age) {
                    this.name = name;
                    this.age = age;
               }
          }

          document.writeln(student.name);
          document.writeln(Emp.name);
     </script>
</body>

</html>
