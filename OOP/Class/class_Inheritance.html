<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Class Inheritance</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          class Car {
               constructor(brand) {
                    this.carname = brand;
               }
               present() {
                    return this.carname;
               }
          }
          class Model extends Car {
               constructor(mod, brand) {
                    super(brand);
                    this.model = mod;
               }
               show() {
                    return this.present() + " " + this.model;
               }
          }

          const myCar = new Model("Ford", "Mustang");
          document.getElementById("demo").innerHTML = myCar.show();
     </script>
</body>

</html>
