<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Send Parameter</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          class Car {
               constructor(name, year) {
                    this.name = name;
                    this.year = year;
               }

               details() {
                    const date = new Date();
                    return date.getFullYear() - this.year;
               }
          }

          const myCar1 = new Car("Ford", 2011);

          document.getElementById("demo").innerHTML = myCar1.details() + "Years Old";
     </script>
</body>

</html>
