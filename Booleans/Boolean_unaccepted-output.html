<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Boolean Unaccepted Output</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let x = false;
          let y = new Boolean(false);

          document.getElementById("demo").innerHTML = (x == y);
     </script>
</body>

</html>
