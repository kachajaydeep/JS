<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>To Solve Arithmatic Operation</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let x = (0.2 * 10 + 0.1 * 10) / 10;
          document.getElementById("demo").innerHTML = `The 0.2 + 0.1 : <b> ${x} </b>`; 
     </script>
</body>

</html>
