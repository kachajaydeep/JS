<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Infinity</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let myNumber = 2;
          let txt = "";
          while (myNumber != Infinity) {
               myNumber **= 2;
               txt += myNumber + "<br>";
          }
          document.getElementById("demo").innerHTML = txt;
     </script>
</body>

</html>
