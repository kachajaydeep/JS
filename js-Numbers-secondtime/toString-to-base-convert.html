<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>toString-to-base-convert</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let myNumber = 32;
          let hexatri = myNumber.toString(36);
          let Duotri = myNumber.toString(32);
          let hexades = myNumber.toString(16);
          let decimal = myNumber.toString(10);
          let octal = myNumber.toString(8);
          let Binary = myNumber.toString(8);

          document.write(hexatri + "<br>" + Duotri + "<br>" + hexades + "<br>" + decimal + "<br>" + octal + "<br>" + Binary);
     </script>
</body>

</html>
