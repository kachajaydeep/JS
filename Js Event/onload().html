<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>onload()</title>
</head>
<body onload = "myfunc()">
     <p>This event is load this page.</p>
     <script>
          function myfunc(){
               alert("Page is load.");
          }
     </script>
</body>
</html>
