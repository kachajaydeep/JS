<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>On-KeyDown</title>
</head>
<body>
     <h1>HTML DOM Events.</h1>
     <p id="demo"></p>
     <input type="text" onkeydown="myFunctionally()" id="input">

     <script>
          function myFunctionally(){
               document.getElementById("demo").innerHTML = "You Pressed a Key inside the input field";
               document.getElementById("input").style.border ="thin solid red";
          }
     </script>
</body>
</html>
