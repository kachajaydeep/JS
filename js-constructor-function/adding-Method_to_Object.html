<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Adding Method To Object</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          function Person(first,last, age, eye) {
               this.firstname = first;
               this.lastname =last;
               this.age = age;
               this.eyeColor = eye;
          }

          const myFather = new Person("John", "Doe", 50);
          const myMother = new Person("sally","Rally",48);

          myMother.changeName = function (name) {
               this.lastname = name;
          }
          myMother.changeName("kajol");
          document.getElementById("demo").innerHTML = myMother.lastname;
     </script>
</body>
</html>
