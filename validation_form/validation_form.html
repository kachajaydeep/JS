<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Validation Form</title>
     <link rel="stylesheet" href="./validation_form.css">
</head>

<body>
     <div class="container">
          <form>
               <div class="row">
                    <div class="col-25">
                         <label for="fName">First Name:</label>
                    </div>
                    <div class="col-75">
                         <input type="text" name="firstname" id="fname" placeholder="Your Name...">
                    </div>
               </div>

               <div class="row">
                    <div class="col-25">
                         <label for="lName">Last Name:</label>
                    </div>
                    <div class="col-75">
                         <input type="text" name="lastname" id="lName" placeholder="Enter Your LastName...">
                    </div>
               </div>

               <div class="row">
                    <div class="col-25">
                         <label for="country">Country</label>
                    </div>

                    <div class="col-75">
                         <select name="country" id="country">
                              <option value="australia">Australia</option>
                              <option value="canada">Canada</option>
                              <option value="usa">USA</option>
                         </select>
                    </div>
               </div>

               <div class="row">
                    <div class="col-25">
                         <label for="subject">Subject</label>
                    </div>
                    <div class="col-75">
                         <textarea name="subject" id="subject" placeholder="write Something..."
                              style="height: 200px;"></textarea>
                    </div>
               </div>
               <br>
               <div class="row">
                    <input type="submit" value="Submit">
               </div>
          </form>
     </div>

     <script>
          
     </script>
</body>

</html>
