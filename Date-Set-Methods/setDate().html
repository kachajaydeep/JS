<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>setMonth()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const date = new Date("January 01, 2025");
          date.setDate(15);
          document.getElementById("demo").innerHTML = date;
     </script>
</body>

</html>
