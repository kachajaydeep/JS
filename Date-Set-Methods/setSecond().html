<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>setSecond</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const d = new Date("January 01, 2025");
          d.setSeconds(30);
          document.getElementById("demo").innerHTML = d;
     </script>
</body>

</html>
