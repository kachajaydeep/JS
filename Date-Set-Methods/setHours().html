<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>setDate Method</title>
</head>

<body>
     <p>The setHours() methods sets the hours of a date object.</p>
     <p id="demo"></p>

     <script>
          const date = new Date();
          date.setHours(15);
          document.getElementById("demo").innerHTML = date;
     </script>
</body>

</html>
