<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Operation Inside Parenthesis</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let x = (100 + 50) * 3;
          document.getElementById("demo").innerHTML = x;
     </script>
</body>
</html>
