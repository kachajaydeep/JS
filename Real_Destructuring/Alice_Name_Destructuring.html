                    'father': 'Brown Williamson',

               'address': {
                    'street': '123, Main Street',
                    'city': 'Cartertoon',
                    'Country': 'New Zealend',
                    'zip': 5791
               }
          }

          const { age: Ages } = Student; // Ages is a Alice and is treate as a variable name.

          document.write(Ages);
     </script>
</body>

</html>
