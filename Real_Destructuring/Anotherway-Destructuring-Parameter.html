<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Another Way Destructuring Parameter</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Student = {
               'name': ' John Williamson ',
               'age': 9,
               'std': 3,
               'subject': ["Maths", "English", "EVS"],
               'Parents': {
                    'father': 'Brown Williamson',
                    'Mother': 'Sophia',
                    'email': 'John-parents@gmail.com',
               },
               'address': {
                    'street': '123, Main Street',
                    'city': 'Cartertoon',
                    'Country': 'New Zealend',
                    'zip': 5791
               }
          }

          let { name, age } = Student;
          let meal = Student.meal ? Student.meal : " Bread ";

          document.writeln(name, age, meal);
     </script>
</body>

</html>
