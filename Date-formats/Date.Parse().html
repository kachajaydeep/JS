<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Date.parse()</title>
</head>
<body>
     <p>Date.Parse Method Converts the date to milli second.</p>
     <p id="demo"></p>

     <script>
          let date = Date.parse("March 21, 2012");
          document.getElementById("demo").innerHTML = date;
     </script>
</body>
</html>
