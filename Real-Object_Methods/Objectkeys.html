<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Keys</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const person = {
               firstName: "Joe",
               lastName: "Doe",
               age: 30,
               eyecolor: "Brown"
          };

          let keyvalue = Object.keys(person);

          document.getElementById("demo").innerHTML = keyvalue;
     </script>
</body>

</html>
