<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ObjectKey-on-array</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Person = ["Sudhir", "hai", 23, "blue"]

          let take = Object.keys(Person);

          document.getElementById("demo").innerHTML = take;
     </script>
</body>

</html>
