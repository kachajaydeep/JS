<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Sealed Array</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = ["Apples", "Banana", "grabs", "Kiwi", "Mango"];

          Object.seal(fruits);

          let Check = Object.isSealed(fruits);

          document.getElementById("demo").innerHTML = Check;
     </script>
</body>

</html>
