<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>DefineProperty</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const person ={
               firstname:"Mr. Joe",
               lastname: "Doe",
               lang:"En"
          };

          Object.defineProperty(person,"lang",{value: "NO"});

          document.getElementById("demo").innerHTML = person.lang;
     </script>
</body>
</html>
