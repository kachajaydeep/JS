<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object ObjectFreez in array</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = ["Apple", "Banana", "grabs"];

          Object.freeze(fruits);

          let text;

          try {
               fruits.push("Mango");
               text = fruits;
          }
          catch (err) {
               text = err;
          }

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
