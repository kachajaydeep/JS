<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ObjectSeal()</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          "use strict";

          const Person ={
               firstName: "Joe",
               lastName: "Doe",
               age: 23,
               eyeColor: "red"
          };

          Object.seal(Person);
          let text;
          try{
               delete Person.firstName;
          }
          catch(err){
            text = err;   
          }

          document.getElementById("demo").innerHTML = text;
     </script>
</body>
</html>
