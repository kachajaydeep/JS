<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Values</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Person = {
               firstName: "Joe",
               lastName: "Doe",
               age: 23,
               eyeColor: "Blue"
          };

          const myArr = Object.values(Person);
          document.getElementById("demo").innerHTML = myArr;
     </script>
</body>

</html>
