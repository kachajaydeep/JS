<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
</head>

<body>
     <p id="demo"></p>
     <p>
          The Object.assign() Methods copies Properties from one or more Source Object to Target Object.
     </p>

     <script>
          const Person1 = {
               firstname: "John",
               lastname: "Doe",
               age: 36,
               eyeColor: "red"
          };

          const Person2 = {
               firstname: "Anne",
               lastname: "Smith"
          };

          Object.assign(Person1, Person2);

          let text = Object.entries(Person1);

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
