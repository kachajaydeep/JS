<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Static Methods</title>
</head>

<body>

     <script>
          //static Methods

          const obj1 = {
               name: 'John',
               age: 30,
          }
          const obj2 = {
               eyeColor: "brown",
               name: "Rock"
          }

          const copy = Object.assign(obj1, obj2);
          console.log(copy);

          document.write(obj1 == obj2);
     </script>
</body>

</html>
