<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Keys in String</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          const fruits = "Banana";

          const keys = Object.keys(fruits);

          document.getElementById("demo").innerHTML = keys;
     </script>
</body>
</html>
