<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Entries Simple to Converts Maps</title>
</head>

<body>
     <p id="demo"></p>
     <p id="demo1"></p>
     <script>
          const chemistry = {
               ch4: 300,
               Nh4: 400,
               MithilinBlue: 600,
          };

          const myMap = new Map(Object.entries(chemistry));

          document.getElementById("demo").innerHTML = myMap;
     </script>
</body>

</html>
