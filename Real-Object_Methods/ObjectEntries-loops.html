<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object-Entries-Loops</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = {
               Banana: 300,
               Grabs: 100,
               Apples: 200,
               Oranges: 500
          };

          let text = "";
          for (let [fruit, value] of Object.entries(fruits)) {
               text += fruit + " : " + value + "<br>";
          };

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
