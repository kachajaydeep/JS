<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Create()</title>
</head>

<body>
     <p>Create an Object from an Existing object.</p>
     <p id="demo"></p>

     <script>
          const person = {
               firstname: "Superman",
               lastname: "Div",
               age: 30
          }

          const marvel = Object.create(person);
          person.firstname = "IronMan";
          const print = Object.entries(person);

          document.getElementById("demo").innerHTML = print;
     </script>
</body>

</html>
