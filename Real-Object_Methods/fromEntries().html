<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>fromEntries()</title>
</head>

<body>
     <p>The fromEntries() Methods Creates an Object From key/value pairs.</p>
     <p id="demo"></p>

     <script>
          const Person = [
               ["John", 300],
               ["Cena", 400],
               ["age", 30]
          ];

          const myObj = Object.fromEntries(Person);

          document.getElementById("demo").innerHTML = myObj.Cena;
     </script>
</body>

</html>
