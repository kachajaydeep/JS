<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Define Property</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const person = {
               first: "tommy",
               second: "stark",
               age: 50,
          };

          Object.defineProperty(person, "language", {
               value: "EN",
               writtable: true,
               ennurable: true,
               configurable: true
          });

          let text = "";

          for (let x in person) {
               text += person[x] + "<br>";
          };
          document.getElementById("demo").innerHTML = text + person.language;
     </script>
</body>

</html>
