<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Object Sealed</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const Person = { firstName: "John", lastName: "Doe" };

          Object.seal(Person);

          let check = Object.isSealed(Person);

          document.getElementById("demo").innerHTML = check;
     </script>
</body>

</html>
