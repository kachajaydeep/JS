<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Instance Of Set</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const cars = new Set(["Odi", "Tata Motors", "Bugadi"]);

          document.getElementById("demo").innerHTML = "cars are instanceof set or Not? :" + (cars instanceof Set);
     </script>
</body>

</html>
