<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Instance Of Array</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = ["Apples", "Banana", "Cherry"];

          document.getElementById("demo").innerHTML = "Fruits is Instance of an Array? : " + (fruits instanceof Array);
     </script>
</body>

</html>
