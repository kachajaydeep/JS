<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Instance Of</title>
</head>

<body>
     <p>The instanceof operator returns true if an object is an instance of a specified Object type:</p>
     <p id="demo"></p>

     <script>
          const time = new Date();

          document.getElementById("demo").innerHTML = " Date : " + (time instanceof Date);
     </script>
</body>

</html>
