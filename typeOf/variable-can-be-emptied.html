<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Variable Can Be Emptied</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let car = "volvo";
          car = undefined;


          document.getElementById("demo").innerHTML =
               "<p> The value of car is : " + car +
               "<p> The type of car is : " + typeof car;
     </script>
</body>

</html>
