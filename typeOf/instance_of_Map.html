<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Instance Of Map</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = new Map([
               ["apples", 230],
               ["Banana", 300],
               ["Grabs", 500]
          ]);

          document.getElementById("demo").innerHTML = "Fruits is a Instance of a Map or Not? :" + (fruits instanceof Map);
     </script>
</body>

</html>
