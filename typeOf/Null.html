<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>"Nothing"</title>
</head>

<body>
     <p>In JavaScript Null is 'Nothing'. It is Supposed to be Something that Doesn't Exist.</p>
     <p id="demo"></p>

     <script>
          let person = { firstName: "John", lastName: "Doe", age: 50, eyeColor: "blue" };

          person = null;
          document.getElementById("demo").innerHTML = "The typeof Person is " + typeof person;
     </script>
</body>

</html>
