<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Determine-Array</title>
</head>

<body>
     <p>Determine to check the array's type using isArray() method.</p>
     <p id="demo"></p>

     <script>
          const fruits = ["Banana", "Orange", "Apple"];
          document.getElementById("demo").innerHTML = Array.isArray(fruits);
     </script>
</body>

</html>
