<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>for of</title>
</head>

<body>
     <p id="demo"></p>
     <p>Iteration Simply Means that looping over an Elemenet.</p>
     
     <script>
          const name = "W3Schools";

          //List all Elements

          let text = "";

          for (let x of name) {
               text += x + "<br>";
          }

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
