<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Iteration Over Map</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = new Map([
               ["apples", 300],
               ["Banana", 200],
               ["Orange", 500]
          ]);

          let text = "";
          for (const x of fruits) {
               text += x + "<br>";
          }

          document.getElementById("demo").innerHTML = text;
     </script>
</body>

</html>
