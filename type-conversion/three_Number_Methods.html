<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Number, parseFloat(), parseInt()</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let y = "5";
          let x = + y;
          document.getElementById("demo").innerHTML = typeof y + "<br>" + typeof x;
     </script>
</body>

</html>
