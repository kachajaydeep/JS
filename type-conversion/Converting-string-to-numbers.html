<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Converting String to Numbers</title>
</head>

<body>
     <p>The Globle method number() Converts a variable into a number.</p>
     <p>The Numeric String ("3.14") converts to a number(3.14).</p>
     <p>An empty String (like"") converts to 0.</p>
     <p>A Non Numeric String (like "John") converts to NaN(Not a Number.)</p>
     <p id="demo"></p>

     <script>
          document.getElementById("demo").innerHTML =
               Number(3.14) + "<br>" +
               Number(Math.PI) + "<br>" +
               Number("  ") + "<br>" +
               Number("") + "<br>" +
               Number("99 88") + "<br>" +
               Number("John");
     </script>
</body>

</html>
