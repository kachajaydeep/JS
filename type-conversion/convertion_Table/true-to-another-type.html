<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>True to another Type</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let x = true;
          document.getElementById("demo").innerHTML =
               "Number : " + Number(x) + "<br>" +
               "Boolean : " + Boolean(x) + "<br>" +
               "String : " + String(x) + "<br>"; 
     </script>
</body>

</html>
