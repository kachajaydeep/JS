<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>-Infinity</title>
</head>

<body>
     <p id="demo" style="font-family: 'Courier New', Courier, monospace;"></p>

     <script>
          let x = -Infinity;
          document.getElementById("demo").innerHTML =
               " Number : " + Number(x) + "<br>" +
               " String : " + String(x) + "<br>" +
               " Boolean : " + Boolean(x);
     </script>
</body>

</html>
