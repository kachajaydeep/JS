<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Two Array Element</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let a = [10, 20];
          document.getElementById("demo").innerHTML =
               " Number() : " + Number(a) + "<br>" +
               " String() : " + String(a) + "<br>" +
               " Boolean() : " + Boolean(a);
     </script>
</body>

</html>
