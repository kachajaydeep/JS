<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>String 1 To Another Type</title>
</head>

<body>
     <p id="demo" style="font-family: 'Courier New', Courier, monospace;"></p>

     <script>
          let a = "1";
          document.getElementById("demo").innerHTML =
               " Number() : " + Number(a) + "<br>" +
               " Boolean() : " + Boolean(a) + "<br>" +
               " String() : " + String(a);
     </script>
</body>

</html>
