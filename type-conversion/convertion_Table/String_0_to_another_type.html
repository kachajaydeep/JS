<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>String 0 to another type</title>
</head>
<body>
     <p id="demo"></p>

     <script>
          let x = "0";
          document.getElementById("demo").innerHTML = 
          Number(x) + "<br>" + 
          String(x) + "<br>" +
          Boolean(x) + "<br>";
     </script>
</body>
</html>
