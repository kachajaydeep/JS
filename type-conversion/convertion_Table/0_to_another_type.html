<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>0 to another type</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let a = 0;
          document.getElementById("demo").innerHTML =
               " Number : " + Number(a) + "<br>" +
               " String : " + String(a) + "<br>" +
               " Boolean : " + Boolean(a) + "<br>";
     </script>
</body>

</html>
