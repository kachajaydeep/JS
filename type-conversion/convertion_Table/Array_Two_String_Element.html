<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Array Two String Element</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let x = ["ten", "twenty"];
          document.getElementById("demo").innerHTML =
               " Number() : " + Number(x) + "<br>" +
               " String() : " + String(x) + "<br>" +
               " Boolean() : " + Boolean(x);
     </script>
</body>

</html>
