<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Unary Operator String to Number</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          let x = "John";
          let y = + x;

          document.getElementById("demo").innerHTML = typeof x + "<br>" + typeof y;
     </script>
</body>

</html>
