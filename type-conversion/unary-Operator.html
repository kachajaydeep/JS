<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Unary Operator</title>
</head>

<body>
     <p>The Unary Operator can be Used to Convert a Variable to a Number.</p>
     <p id="demo"></p>

     <script>
          let x = "5";
          let y = + x;
          document.getElementById("demo").innerHTML = typeof y + "<br>" + typeof x;
     </script>
     
</body>

</html>
