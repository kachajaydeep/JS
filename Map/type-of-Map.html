<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Type of Map</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = new Map([
               ["apples", 300],
               ["Mango", 600],
               ["Oranges", 900]
          ]);

          document.getElementById("demo").innerHTML = typeof fruits;
     </script>
</body>

</html>
