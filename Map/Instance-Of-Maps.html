<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Type Of Map</title>
</head>

<body>
     <p id="demo"></p>

     <script>
          const fruits = new Map([
               ["banana", 500],
               ["mango", 400],
               ["grabs", 200],
          ]);

          document.getElementById("demo").innerHTML = fruits instanceof Map;
     </script>
</body>

</html>
